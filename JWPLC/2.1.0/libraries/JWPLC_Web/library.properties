name=JWPLC_Web
version=0.1.0
author=JW Control
maintainer=JW Control <jw.control.peru@gmail.com>
sentence=Panel web del JWPLC Basic con usuarios y contraseña: variables, alarmas, tendencia y la pantalla en vivo.
paragraph=Con JWPLC_Web.begin() y publish() el equipo sirve un panel para el celular o la PC que se arma solo con las variables del programa: valores en vivo, consignas con rango, alarmas con reconocimiento, tendencia con descarga CSV, la pantalla del equipo con la botonera (antes JWPLC_WebScreen) y auditoría. Sin clave de fábrica: el primer ingreso usa un código de 6 dígitos del equipo. La contraseña no viaja por la red (reto HMAC-SHA256 sobre PBKDF2). Por cable, WiFi o los dos con JWPLC_Red.
category=Communication
url=https://github.com/JW-Control/platform-jwplc
architectures=esp32
includes=JWPLC_Web.h
depends=JWPLC_Red,JWPLC_Ethernet,JWPLC_TFT,JWPLC_GlobalPeripherals,JW_MatrixButtons,Preferences
