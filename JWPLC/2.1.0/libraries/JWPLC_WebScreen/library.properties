name=JWPLC_WebScreen
version=0.1.0
author=JW Control
maintainer=JW Control <jw.control.peru@gmail.com>
sentence=Pantalla del JWPLC Basic en vivo en el navegador, con botonera virtual, por Ethernet.
paragraph=Con JWPLC_WebScreen.begin() el equipo sirve una página web (puerto 80) que muestra la TFT en vivo y tiene las seis teclas de la botonera. Sirve para demostraciones, soporte remoto y para manejar el Runtime de panel desde la laptop. Usa una copia de la pantalla en RAM (54 KB) y solo envía las filas que cambian.
category=Communication
url=https://github.com/JW-Control/platform-jwplc
architectures=esp32
includes=JWPLC_WebScreen.h
depends=JWPLC_TFT,JWPLC_Ethernet,JWPLC_GlobalPeripherals,JW_MatrixButtons
