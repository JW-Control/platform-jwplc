sentence=Cable o WiFi con el mismo código: elige la red y da un cliente TCP común.
paragraph=Capa común de red del JWPLC Basic. Elige Ethernet (W5500), WiFi o automático (cable si está conectado, si no WiFi) y ofrece JWPLC_RedClient, un cliente TCP que sale por la red activa. Sobre ella se construyen HTTP, HTTPS, MQTT y JW Cloud. WiFi es opcional: solo se usa si el sketch incluye JWPLC_WiFi.h.
