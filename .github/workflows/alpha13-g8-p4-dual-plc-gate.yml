name: Alpha13 G8 P4 - two JWPLC gate selftest

on:
  push:
    branches:
      - 'v2.1.0-alpha.13/feature/cleanup-robustness'
    paths:
      - '.github/workflows/alpha13-g8-p4-dual-plc-gate.yml'
      - 'tools/alpha13/gates/a13_g8_p4_dual_plc_physical.py'
      - 'tools/alpha13/gates/a13_g8_p4_contract_selftest.py'
      - 'tools/alpha13/gates/run_a13_g8_p4_dual_plc_physical.bat'
      - 'tools/alpha13/sketches/g8_p4_master/**'
      - 'tools/alpha13/sketches/g8_p4_slave/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p4-gate-selftest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Sintaxis y ayuda sin hardware
        run: |
          python -m py_compile tools/alpha13/gates/a13_g8_p4_dual_plc_physical.py tools/alpha13/gates/a13_g8_p4_contract_selftest.py
          python -B tools/alpha13/gates/a13_g8_p4_dual_plc_physical.py --help
      - name: Casos positivos negativos y fuente exacta
        shell: pwsh
        run: |
          python -B tools/alpha13/gates/a13_g8_p4_contract_selftest.py | Tee-Object -FilePath g8_p4_selftest.log
          if ($LASTEXITCODE -ne 0) { throw 'G8_P4_SELFTEST_RUN_FAILED' }
          if ((Get-Content g8_p4_selftest.log -Raw) -notmatch 'G8_P4_SELFTEST=PASS_NO_HARDWARE_ACCESS') { throw 'G8_P4_SELFTEST_PASS_MISSING' }
      - name: Guardar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha13-g8-p4-selftest-${{ matrix.os }}-${{ github.run_id }}
          path: g8_p4_selftest.log
          if-no-files-found: warn
