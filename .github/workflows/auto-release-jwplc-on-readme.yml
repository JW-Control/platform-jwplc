name: Auto Release JWPLC from README

on:
  push:
    branches:
      - release/v2.1.x
    paths:
      - README.md
      - .github/workflows/release-jwplc-package.yml
      - .github/workflows/auto-release-jwplc-on-readme.yml

permissions:
  contents: read
  actions: write

jobs:
  detect-and-dispatch:
    name: Detectar version y disparar release
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detectar release pendiente
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          read_version() {
            sed -n \
              's/.*<!-- JWPLC_RELEASE_VERSION: \([^ ]*\) -->.*/\1/p' \
              "$1" | head -n 1
          }

          CURRENT_VERSION="$(read_version README.md)"

          if [[ -z "$CURRENT_VERSION" ]]; then
            echo "No se encontro JWPLC_RELEASE_VERSION en README.md"
            exit 1
          fi

          if [[ ! "$CURRENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z]+\.[0-9]+)?$ ]]; then
            echo "Version invalida: $CURRENT_VERSION"
            exit 1
          fi

          PREVIOUS_VERSION=""
          BEFORE="${{ github.event.before }}"

          if [[ -n "$BEFORE" ]] &&
             [[ "$BEFORE" != "0000000000000000000000000000000000000000" ]] &&
             git cat-file -e "$BEFORE:README.md" 2>/dev/null; then

            git show "$BEFORE:README.md" > /tmp/README.before
            PREVIOUS_VERSION="$(read_version /tmp/README.before)"
          fi

          TAG="v$CURRENT_VERSION"
          NOTES_FILE="docs/v${CURRENT_VERSION}/PRE_RELEASE.md"

          echo "Version anterior : ${PREVIOUS_VERSION:-<none>}"
          echo "Version actual   : $CURRENT_VERSION"
          echo "Tag esperado     : $TAG"

          if [[ ! -f "$NOTES_FILE" ]]; then
            echo "Falta documentacion de PreRelease:"
            echo "$NOTES_FILE"
            exit 1
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "La release $TAG ya existe. No se relanza."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$CURRENT_VERSION" == "$PREVIOUS_VERSION" ]]; then
            echo "El marcador no cambio, pero $TAG aun no existe."
            echo "Se trata como reintento automatico de una publicacion pendiente."
          else
            echo "Se detecto una nueva version de release en README.md."
          fi

          echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"

      - name: Disparar workflow de publicación
        if: steps.version.outputs.should_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          NOTES_FILE: ${{ steps.version.outputs.notes_file }}
        run: |
          set -euo pipefail

          echo "Disparando publicación de v$VERSION"

          gh workflow run release-jwplc-package.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            -f version="$VERSION" \
            -f channel="auto" \
            -f source_folder="JWPLC/2.1.0" \
            -f recreate_zip="true" \
            -f archive_root_mode="folder" \
            -f update_public_index="auto" \
            -f replace_existing_index_entry="false" \
            -f commit_index_changes="true" \
            -f publish_release="true" \
            -f fail_if_release_exists="true" \
            -f overwrite_release_asset="false" \
            -f release_notes_file="$NOTES_FILE" \
            -f upload_workflow_artifact="true" \
            -f open_index_pr="true" \
            -f index_pr_base_branch="main"

          echo "Release workflow enviado."
