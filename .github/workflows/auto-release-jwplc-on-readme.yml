name: Auto Release JWPLC from README

on:
  push:
    branches:
      - release/v2.1.x
    paths:
      - README.md
      - .github/workflows/release-jwplc-package.yml
      - .github/workflows/auto-release-jwplc-on-readme.yml

permissions:
  contents: read
  actions: write

jobs:
  detect-and-dispatch:
    name: Detectar versión y disparar release
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detectar release pendiente
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          read_version() {
            sed -n \
              's/.*<!-- JWPLC_RELEASE_VERSION: \([^ ]*\) -->.*/\1/p' \
              "$1" | head -n 1
          }

          CURRENT_VERSION="$(read_version README.md)"

          if [[ -z "$CURRENT_VERSION" ]]; then
            echo "No se encontró JWPLC_RELEASE_VERSION en README.md"
            exit 1
          fi

          if [[ ! "$CURRENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z]+\.[0-9]+)?$ ]]; then
            echo "Versión inválida: $CURRENT_VERSION"
            exit 1
          fi

          PREVIOUS_VERSION=""
          BEFORE="${{ github.event.before }}"

          if [[ -n "$BEFORE" ]] &&
             [[ "$BEFORE" != "0000000000000000000000000000000000000000" ]] &&
             git cat-file -e "$BEFORE:README.md" 2>/dev/null; then

            git show "$BEFORE:README.md" > /tmp/README.before
            PREVIOUS_VERSION="$(read_version /tmp/README.before)"
          fi

          TAG="v$CURRENT_VERSION"
          NOTES_FILE="docs/v${CURRENT_VERSION}/PRE_RELEASE.md"

          echo "Versión anterior : ${PREVIOUS_VERSION:-<none>}"
          echo "Versión actual   : $CURRENT_VERSION"
          echo "Tag esperado     : $TAG"

          if [[ ! -f "$NOTES_FILE" ]]; then
            echo "Falta documentación de PreRelease:"
            echo "$NOTES_FILE"
            exit 1
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "La release $TAG ya existe. No se relanza."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$CURRENT_VERSION" == "$PREVIOUS_VERSION" ]]; then
            echo "El marcador no cambió, pero $TAG aún no existe."
            echo "Se trata como reintento automático de una publicación pendiente."
          else
            echo "Se detectó una nueva versión de release en README.md."
          fi

          echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"

      - name: Disparar workflow de publicación
        if: steps.version.outputs.should_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          echo "Disparando publicación de v$VERSION"
          echo "El workflow de release aplica la política fija del package."

          gh workflow run release-jwplc-package.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            -f version="$VERSION"

          echo "Release workflow enviado."
