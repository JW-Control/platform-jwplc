name: Alpha13 G10 P1G-C2-S2C2B1 - source-backed UDP lifecycle
on:
  push:
    branches:
      - 'v2.1.0-alpha.13/feature/cleanup-robustness'
    paths:
      - '.github/workflows/alpha13-g10-p1g-c2-s2c2b1-udp-lifecycle.yml'
      - 'tools/alpha13/gates/a13_g10_p1g_c2_s2c2b1_udp_lifecycle.py'
      - 'tools/alpha13/gates/run_a13_g10_p1g_c2_s2c2b1_udp_lifecycle.bat'
      - 'tools/alpha13/candidates/g10_p1g_c/native_c2_s2c2b1_udp_lifecycle_test.cpp'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  udp-real-source:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python gate syntax
        shell: pwsh
        run: |
          python -m py_compile tools/alpha13/gates/a13_g10_p1g_c2_s2c2b1_udp_lifecycle.py
          python -B tools/alpha13/gates/a13_g10_p1g_c2_s2c2b1_udp_lifecycle.py --help
          if ($LASTEXITCODE -ne 0) { throw 'C2_S2C2B1_SYNTAX_FAILED' }
      - name: Native six real UDP methods and five negative mutations
        shell: pwsh
        run: |
          python -B tools/alpha13/gates/a13_g10_p1g_c2_s2c2b1_udp_lifecycle.py --ci-standalone | Tee-Object -FilePath c2_s2c2b1.log
          if ($LASTEXITCODE -ne 0) { throw 'C2_S2C2B1_NATIVE_FAILED' }
          $s = Get-Content c2_s2c2b1.log -Raw
          if ($s -notmatch 'G10_P1G_C2_S2C2B1_POSITIVE_NATIVE=PASS_SIX_REAL_UDP_METHODS') { throw 'UDP_POSITIVE_MISSING' }
          if ($s -notmatch 'G10_P1G_C2_S2C2B1_NEGATIVES=5') { throw 'UDP_NEGATIVES_MISSING' }
          if ($s -notmatch 'G10_P1G_C2_S2C2B1_STATUS=UDP_REAL_CPP_LIFECYCLE_NATIVE_PASS_DNS_PENDING_ADOPTION_BLOCKED') { throw 'UDP_WRONG_STATUS' }
      - name: No modifications to source tree
        shell: pwsh
        run: |
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'PRODUCT_SOURCE_CHANGED' }
      - name: Upload source-overlay test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha13-c2-s2c2b1-${{ matrix.os }}-${{ github.run_id }}
          path: |
            c2_s2c2b1.log
            tools/alpha13/results/g10_p1g_c2_s2c2b1_*/
          if-no-files-found: warn
