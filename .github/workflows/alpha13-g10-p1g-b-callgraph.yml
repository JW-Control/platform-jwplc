name: Alpha13 G10 P1G-B - Ethernet callgraph contracts

on:
  push:
    branches:
      - 'v2.1.0-alpha.13/feature/cleanup-robustness'
    paths:
      - '.github/workflows/alpha13-g10-p1g-b-callgraph.yml'
      - 'tools/alpha13/gates/a13_g10_p1g_b_callgraph_contract.py'
      - 'tools/alpha13/gates/run_a13_g10_p1g_b_callgraph_contract.bat'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  callgraph-source-witnesses:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax and help
        shell: pwsh
        run: |
          python -m py_compile tools/alpha13/gates/a13_g10_p1g_b_callgraph_contract.py
          python -B tools/alpha13/gates/a13_g10_p1g_b_callgraph_contract.py --help
          if ($LASTEXITCODE -ne 0) { throw 'P1G_B_SYNTAX_FAILED' }
      - name: Negative source mutations
        shell: pwsh
        run: |
          python -B tools/alpha13/gates/a13_g10_p1g_b_callgraph_contract.py --selftest | Tee-Object -FilePath p1g_b_selftest.log
          if ($LASTEXITCODE -ne 0) { throw 'P1G_B_NEGATIVE_TESTS_FAILED' }
          if ((Get-Content p1g_b_selftest.log -Raw) -notmatch 'G10_P1G_B_SELFTEST=PASS_FIVE_NEGATIVES') { throw 'P1G_B_NEGATIVES_MISSING' }
      - name: Callgraph witness inventory
        shell: pwsh
        run: |
          python -B tools/alpha13/gates/a13_g10_p1g_b_callgraph_contract.py --ci-standalone | Tee-Object -FilePath p1g_b_inventory.log
          if ($LASTEXITCODE -ne 0) { throw 'P1G_B_INVENTORY_FAILED' }
          $s=Get-Content p1g_b_inventory.log -Raw
          if ($s -notmatch 'G10_P1G_B_WITNESSES=19') { throw 'P1G_B_WITNESSES_MISSING' }
          if ($s -notmatch 'G10_P1G_B_STATUS=CALLGRAPH_WITNESSES_CAPTURED_ADOPTION_BLOCKED') { throw 'P1G_B_STATUS_MISMATCH' }
      - name: Product unchanged
        shell: pwsh
        run: |
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'P1G_B_PRODUCT_CHANGED' }
      - name: Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha13-g10-p1g-b-${{ matrix.os }}-${{ github.run_id }}
          path: |
            p1g_b_selftest.log
            p1g_b_inventory.log
            tools/alpha13/results/g10_p1g_b_*/
          if-no-files-found: warn
