name: Alpha13 PRE-H B4 seguridad banco y backups no fisico
on:
  pull_request:
    paths:
      - '.github/workflows/alpha13-preh-b4-safety.yml'
      - 'tools/alpha13/gates/a13_g10_r_b4_bench.py'
      - 'tools/alpha13/gates/a13_g10_r_h0_dev_waiver.py'
      - 'tools/alpha13/gates/a13_g10_r_b3_scope.py'
      - 'tools/alpha13/gates/a13_g10_r_field_runner.py'
      - 'tools/alpha13/gates/a13_g10_r_build_candidate.py'
      - 'tools/alpha13/gates/a13_g10_r_h0_link_stage.py'
      - 'tools/alpha13/gates/a13_g10_r_h0_w5100_stage.py'
      - 'tools/alpha13/gates/a13_g10_r_h0_init_stage.py'
      - 'docs/v2.1.0-alpha.13/A13_G10_R_PREH_B4_BANCO_RESPALDOS_SEGURIDAD_20261017.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preh-b4:
    name: B4 preflight fail closed (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Contrato B4 y 14 mutaciones de respaldo
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/alpha13/gates/a13_g10_r_b4_bench.py --selftest
          python -B tools/alpha13/gates/a13_g10_r_b3_scope.py --selftest
          python -B tools/alpha13/gates/a13_g10_r_b3_scope.py --check
          git diff --quiet a954cabd9c6e37876b59995a41ff0a449308ccd1 HEAD -- JWPLC/
      - name: La ficha vacia no autoriza nada
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/alpha13/gates/a13_g10_r_b4_bench.py --template "$RUNNER_TEMP/b4-empty-local.json"
          set +e
          python -B tools/alpha13/gates/a13_g10_r_b4_bench.py --check "$RUNNER_TEMP/b4-empty-local.json" > "$RUNNER_TEMP/b4-denied.log" 2>&1
          status=$?
          set -e
          test "$status" -eq 2
          grep -Fq 'G10_R_B4_OPERATOR_PREFLIGHT=REVIEW_STOP' "$RUNNER_TEMP/b4-denied.log"
          echo "B4_EMPTY_OPERATOR_FORM=DENIED"
      - name: Dev-only waiver no concede upload implicito
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/alpha13/gates/a13_g10_r_h0_dev_waiver.py --selftest
          python -B tools/alpha13/gates/a13_g10_r_h0_dev_waiver.py --template "$RUNNER_TEMP/h0-blank-waiver.json"
          set +e
          python -B tools/alpha13/gates/a13_g10_r_h0_dev_waiver.py --check "$RUNNER_TEMP/h0-blank-waiver.json" > "$RUNNER_TEMP/h0-denied.log" 2>&1
          doc_rc=$?
          python -B tools/alpha13/gates/a13_g10_r_build_candidate.py --upload --dev-waiver "$RUNNER_TEMP/h0-blank-waiver.json" > "$RUNNER_TEMP/h0-upload-denied.log" 2>&1
          upload_rc=$?
          set -e
          test "$doc_rc" -eq 2
          test "$upload_rc" -eq 2
          grep -Fq 'H0_DEV_WAIVER_REVIEW_STOP' "$RUNNER_TEMP/h0-upload-denied.log"
          echo "H0_DEV_WAIVER=FAIL_CLOSED_NO_USB_NO_FLASH"
      - name: H0 con waiver válido rechaza ruta de upload doble ANTES de COM
        shell: bash
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import json
          import os
          import runpy
          from pathlib import Path
          h0=runpy.run_path("tools/alpha13/gates/a13_g10_r_h0_dev_waiver.py")
          doc=h0["template"]()
          for port,mac in (("COM4","02:00:00:00:00:04"),("COM14","02:00:00:00:00:14")):
              doc["device_roles"][port]["expected_mac"]=mac
          doc["physical_checks"]={name:True for name in doc["physical_checks"]}
          doc["accept_loss_exact_phrase"]=h0["ACK"]
          assert not h0["validate"](doc)
          (Path(os.environ["RUNNER_TEMP"])/"h0-synthetic-valid.json").write_text(json.dumps(doc),encoding="utf-8")
          PY
          set +e
          python -B tools/alpha13/gates/a13_g10_r_build_candidate.py --upload --dev-waiver "$RUNNER_TEMP/h0-synthetic-valid.json" > "$RUNNER_TEMP/h0-dual-denied.log" 2>&1
          rc=$?
          set -e
          test "$rc" -eq 2
          grep -Fq 'H0_BRANCH_DUAL_UPLOAD_FORBIDDEN' "$RUNNER_TEMP/h0-dual-denied.log"
          echo "H0_VALID_WAIVER_DUAL_UPLOAD=DENIED_BEFORE_USB"
      - name: Sin ficha no hay upload ni captura
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/alpha13/gates/a13_g10_r_build_candidate.py --selftest
          python -B tools/alpha13/gates/a13_g10_r_field_runner.py --selftest
          python -B tools/alpha13/gates/a13_g10_r_field_runner.py --dry-run
          set +e
          python -B tools/alpha13/gates/a13_g10_r_build_candidate.py --upload > "$RUNNER_TEMP/b4-upload-denied.log" 2>&1
          flash_rc=$?
          python -B tools/alpha13/gates/a13_g10_r_field_runner.py --live --upload-evidence "$RUNNER_TEMP/absent.json" > "$RUNNER_TEMP/b4-live-denied.log" 2>&1
          live_rc=$?
          set -e
          test "$flash_rc" -eq 2
          test "$live_rc" -eq 2
          grep -Fq 'B4_BENCH_BACKUP_EVIDENCE_REQUIRED' "$RUNNER_TEMP/b4-upload-denied.log"
          grep -Fq 'B4_BENCH_BACKUP_EVIDENCE_REQUIRED_BEFORE_COM' "$RUNNER_TEMP/b4-live-denied.log"
          echo "B4_FLASH_AND_COM=FAIL_CLOSED_NO_HARDWARE"
          echo "B4_OPERATOR_BACKUP=NOT_RUN"
