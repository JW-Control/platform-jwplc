name: Alpha13 G10 P1G-C2-S2C2A - legacy connect IP and host pre-DNS
on:
  push:
    branches:
      - 'v2.1.0-alpha.13/feature/cleanup-robustness'
    paths:
      - '.github/workflows/alpha13-g10-p1g-c2-s2c2a-legacy-connect.yml'
      - 'tools/alpha13/gates/a13_g10_p1g_c2_s2c2a_legacy_connect.py'
      - 'tools/alpha13/gates/run_a13_g10_p1g_c2_s2c2a_legacy_connect.bat'
      - 'tools/alpha13/candidates/g10_p1g_c/native_c2_s2c2a_legacy_connect_test.cpp'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  legacy-source:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python syntax
        shell: pwsh
        run: |
          python -m py_compile tools/alpha13/gates/a13_g10_p1g_c2_s2c2a_legacy_connect.py
          python -B tools/alpha13/gates/a13_g10_p1g_c2_s2c2a_legacy_connect.py --help
          if ($LASTEXITCODE -ne 0) { throw 'C2_S2C2A_SYNTAX_FAILED' }
      - name: Native seven real bodies + five negative mutations
        shell: pwsh
        run: |
          python -B tools/alpha13/gates/a13_g10_p1g_c2_s2c2a_legacy_connect.py --ci-standalone | Tee-Object -FilePath c2_s2c2a.log
          if ($LASTEXITCODE -ne 0) { throw 'C2_S2C2A_NATIVE_FAILED' }
          $s=Get-Content c2_s2c2a.log -Raw
          if ($s -notmatch 'G10_P1G_C2_S2C2A_POSITIVE_NATIVE=PASS_SOURCE_IP_HOST_PRE_DNS') { throw 'POSITIVE_MISSING' }
          if ($s -notmatch 'G10_P1G_C2_S2C2A_NEGATIVES=5') { throw 'NEGATIVES_MISSING' }
          if ($s -notmatch 'G10_P1G_C2_S2C2A_STATUS=LEGACY_CONNECT_IP_HOST_PREDNS_NATIVE_PASS_DNS_UNPROTECTED_ADOPTION_BLOCKED') { throw 'STATUS_MISSING' }
      - name: Product unchanged
        shell: pwsh
        run: |
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'PRODUCT_SOURCE_MUTATED' }
      - name: Native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha13-c2-s2c2a-${{ matrix.os }}-${{ github.run_id }}
          path: |
            c2_s2c2a.log
            tools/alpha13/results/g10_p1g_c2_s2c2a_*/
          if-no-files-found: warn
