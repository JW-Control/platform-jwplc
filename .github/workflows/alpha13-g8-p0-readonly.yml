name: Alpha13 G8 P0 - source baseline

on:
  push:
    branches:
      - 'v2.1.0-alpha.13/feature/cleanup-robustness'
    paths:
      - '.github/workflows/alpha13-g8-p0-readonly.yml'
      - 'tools/alpha13/gates/a13_g8_p0_baseline.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  g8-p0-source-static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax and CLI help
        run: |
          python3 -m py_compile tools/alpha13/gates/a13_g8_p0_baseline.py
          python3 -B tools/alpha13/gates/a13_g8_p0_baseline.py --help
      - name: Check actual source baseline without hardware or compiler
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          import tempfile
          path = Path("tools/alpha13/gates/a13_g8_p0_baseline.py")
          spec = importlib.util.spec_from_file_location("g8p0", path)
          gate = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(gate)
          with tempfile.TemporaryDirectory(prefix="jwplc_g8_ci_") as tmp:
              gate.RESULTS = Path(tmp)
              gate.MANIFEST.update({"schema":"CI_SOURCE_ONLY","run_id":"ci_source","status":"TEST","phases":{}})
              gate.source_diagnostics()
              assert gate.MANIFEST["phases"]["SOURCE_CONTRACT"] == "PASS"
              assert all(gate.MANIFEST["source_observations"].values())
          print("G8_P0_CI_SOURCE_CONTRACT=PASS")
          PY
