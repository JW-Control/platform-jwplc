name: Alpha13 G9 P5 - COM4 physical smoke contract

on:
  push:
    branches:
      - 'v2.1.0-alpha.13/feature/cleanup-robustness'
    paths:
      - '.github/workflows/alpha13-g9-p5-physical-contract.yml'
      - 'tools/alpha13/gates/a13_g9_p5_physical_com4.py'
      - 'tools/alpha13/gates/a13_g9_p5_selftest.py'
      - 'tools/alpha13/gates/run_a13_g9_p5_physical_com4.bat'
      - 'tools/alpha13/sketches/g9_p5_sd_rtc_buttons/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  g9-p5-readonly-contract:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validar sintaxis y ayuda sin hardware
        shell: pwsh
        run: |
          python -m py_compile tools/alpha13/gates/a13_g9_p5_physical_com4.py tools/alpha13/gates/a13_g9_p5_selftest.py
          python -B tools/alpha13/gates/a13_g9_p5_physical_com4.py --help
          if ($LASTEXITCODE -ne 0) { throw 'G9_P5_HELP_FAILED' }
      - name: Verificar parser negativo y sketch sin escritura
        shell: pwsh
        run: |
          python -B tools/alpha13/gates/a13_g9_p5_selftest.py | Tee-Object -FilePath g9_p5_selftest.log
          if ($LASTEXITCODE -ne 0) { throw 'G9_P5_SELFTEST_FAILED' }
          if ((Get-Content g9_p5_selftest.log -Raw) -notmatch 'G9_P5_SELFTEST=PASS_NO_HARDWARE_ACCESS') { throw 'G9_P5_SELFTEST_MARKER_MISSING' }
      - name: Comprobar archivos rastreados inalterados
        shell: pwsh
        run: |
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'G9_P5_SELFTEST_MODIFIED_PRODUCT' }
      - name: Guardar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g9-p5-contract-${{ matrix.os }}-${{ github.run_id }}
          path: g9_p5_selftest.log
          if-no-files-found: warn
