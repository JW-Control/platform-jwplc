name: Alpha13 G10 - promover 12 fuentes funcionales solo rama candidata
on:
  pull_request:
    paths:
      - 'tools/alpha13/gates/a13_g10_promote_functional.py'
      - '.github/workflows/alpha13-g10-promote-functional.yml'
permissions:
  contents: write
jobs:
  promote:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/alpha13-g10-promote-functional-20261019'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Distinguir promoción pendiente de promoción ya incorporada
        id: promotion
        shell: bash
        run: |
          set -euo pipefail
          if test -f JWPLC/2.1.0/libraries/JWPLC_Ethernet/src/JWPLC_W5500_SafeAccess.cpp; then
            python -B tools/alpha13/gates/a13_g10_promoted_contract.py
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            python -B tools/alpha13/gates/a13_g10_promote_functional.py
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Promover exclusivamente fuentes funcionales a la rama PR
        if: steps.promotion.outputs.already == 'false'
        run: python -B tools/alpha13/gates/a13_g10_promote_functional.py --apply
      - name: "Negativos: diff restringido, F1 y archivos precompilados"
        if: steps.promotion.outputs.already == 'false'
        shell: bash
        run: |
          set -euo pipefail
          count=$(git status --porcelain -- JWPLC/ | wc -l | tr -d ' ')
          test "$count" -eq 12
          test -z "$(git status --porcelain -- JWPLC/2.1.0/libraries/JWPLC_Ethernet/src/utility/w5100.cpp)"
          test -z "$(git status --porcelain -- JWPLC/2.1.0/boards.txt JWPLC/2.1.0/platform.txt)"
          test -z "$(git status --porcelain -- '*.a')"
          git diff --check
      - name: Publicar SOLO en la rama aislada G10, nunca en Alpha13 base
        if: steps.promotion.outputs.already == 'false'
        shell: bash
        env:
          TARGET_BRANCH: codex/alpha13-g10-promote-functional-20261019
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- JWPLC/2.1.0/libraries/JWPLC_Ethernet/src/JWPLC_W5x00_Ethernet.h             JWPLC/2.1.0/libraries/JWPLC_Ethernet/src/EthernetClient.cpp             JWPLC/2.1.0/libraries/JWPLC_Ethernet/src/EthernetServer.cpp             JWPLC/2.1.0/libraries/JWPLC_Ethernet/src/EthernetUdp.cpp             JWPLC/2.1.0/libraries/JWPLC_Ethernet/src/socket.cpp             JWPLC/2.1.0/libraries/JWPLC_Ethernet/src/JWPLC_Ethernet.cpp             JWPLC/2.1.0/libraries/JWPLC_Ethernet/src/JWPLC_W5500_SafeAccess.h             JWPLC/2.1.0/libraries/JWPLC_Ethernet/src/JWPLC_W5500_SafeAccess.cpp             JWPLC/2.1.0/libraries/JWPLC_ModbusTCP/src/JWPLC_ModbusTCP.cpp             JWPLC/2.1.0/libraries/JWPLC_ModbusTCP/src/JWPLC_ModbusTCP_Client.cpp             JWPLC/2.1.0/libraries/JWPLC_ModbusTCP/src/JWPLC_ModbusTCP.h             JWPLC/2.1.0/libraries/JWPLC_ModbusTCP/src/JWPLC_ModbusTCP_Client.h
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" -eq 12
          git commit -m "feat(alpha13/G10): promover source-backpack funcional a package sin laboratorio"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
