name: Alpha11 modernize Ethernet TFT examples

on:
  push:
    branches:
      - v2.1.0-alpha.11/feature/hmi-designer
    paths:
      - ".github/workflows/alpha11-modernize-ethernet-tft.yml"

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Migrar TFT Ethernet a fields declarativos
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('.')

          def load(rel):
              p = ROOT / rel
              return p, p.read_text(encoding='utf-8')

          def save(p, text):
              p.write_text(text, encoding='utf-8', newline='\n')

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'No se encontró bloque esperado: {label}')
              return text.replace(old, new, 1)

          def replace_region(text, start, end, replacement, label):
              i = text.find(start)
              if i < 0:
                  raise SystemExit(f'No se encontró inicio: {label}')
              j = text.find(end, i)
              if j < 0:
                  raise SystemExit(f'No se encontró fin: {label}')
              return text[:i] + replacement + text[j:]

          # ================================================================
          # 1) Ethernet_SPI_Coexistence
          # ================================================================
          rel = 'JWPLC/2.1.0/libraries/JWPLC_Ethernet/examples/Ethernet_SPI_Coexistence/Ethernet_SPI_Coexistence.ino'
          p, s = load(rel)

          s = s.replace(
              '  - Incluye JWPLC_Display.h porque usa la TFT directamente.\n',
              '  - Usa fields declarativos de JWPLC_Display; no dibuja la TFT directamente.\n'
          )
          s = s.replace(
              '  - En callbacks gráficos NO se consultan periféricos SPI.\n',
              '  - setText() sólo invalida el field cuando cambia su contenido.\n'
          )

          spi_ui = r'''enum SpiUiFieldId : uint8_t
{
  SPI_FIELD_TITLE = 1,
  SPI_FIELD_ETH,
  SPI_FIELD_IP,
  SPI_FIELD_SD,
  SPI_FIELD_FRAM,
  SPI_FIELD_LOGS,
  SPI_FIELD_INFO
};

static const JWPLC_UIField SPI_FIELDS[] = {
    JWPLC_UITextField(
        SPI_FIELD_TITLE,
        JWPLC_UIRect(8, 4),
        JWPLC_UIText(nullptr, nullptr, 24),
        JWPLC_UITextFieldStyle(2, 1, false, JWPLC_UI_LAYOUT_INLINE, JWPLC_UI_ALIGN_LEFT),
        0,
        JWPLC_UIColors(ST77XX_CYAN, ST77XX_CYAN, ST77XX_BLACK, ST77XX_CYAN)),
    JWPLC_UITextField(SPI_FIELD_ETH, 8, 34, "ETH", 31),
    JWPLC_UITextField(SPI_FIELD_IP, 8, 54, "IP", 20),
    JWPLC_UITextField(SPI_FIELD_SD, 8, 74, "SD", 31),
    JWPLC_UITextField(SPI_FIELD_FRAM, 8, 94, "FRAM", 31),
    JWPLC_UITextField(SPI_FIELD_LOGS, 8, 114, "Logs", 16),
    JWPLC_UITextField(SPI_FIELD_INFO, 8, 140, nullptr, 28)};

void syncSpiUi()
{
  char framLine[32] = {};
  char logsLine[16] = {};

  snprintf(framLine, sizeof(framLine), "%s  Boot:%lu",
           framStatusText, (unsigned long)bootCounter);
  snprintf(logsLine, sizeof(logsLine), "%lu", (unsigned long)logCounter);

  JWPLC_Display.setText(SPI_FIELD_TITLE, "SPI COEXISTENCIA");
  JWPLC_Display.setText(SPI_FIELD_ETH, ethStatusText);
  JWPLC_Display.setText(SPI_FIELD_IP, ethIpText);
  JWPLC_Display.setText(SPI_FIELD_SD, sdStatusText);
  JWPLC_Display.setText(SPI_FIELD_FRAM, framLine);
  JWPLC_Display.setText(SPI_FIELD_LOGS, logsLine);
  JWPLC_Display.setText(SPI_FIELD_INFO, "IDLE AUTOMATICO EN 8s");
}

'''
          s = replace_once(s, 'bool ethernetHasFault() {', spi_ui + 'bool ethernetHasFault() {', 'SPI fields')

          s = replace_once(
              s,
              '  copyText(framStatusText, sizeof(framStatusText), framOk ? "OK" : "NO");\n}',
              '  copyText(framStatusText, sizeof(framStatusText), framOk ? "OK" : "NO");\n  syncSpiUi();\n}',
              'SPI sync cached status'
          )

          s = replace_region(
              s,
              'extern "C" void jwplcUIEnter()',
              'void loadBootCounterFromFRAM()',
              '',
              'SPI callbacks manuales'
          )

          setup_marker = '''  Serial.println("Runtime auto Ethernet. No begin() called.");

  loadBootCounterFromFRAM();
'''
