name: Alpha13 H0 E1 E2 - ELF y SDK no fisico
on:
  pull_request:
    paths:
      - '.github/workflows/alpha13-h0-e1e2.yml'
      - 'tools/alpha13/gates/a13_h0_e1e2_verify.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e1-e2:
    name: H0 E1 ELF / E2 sdkconfig exactos sin N3
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.5.1'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15/packages/jwplc
            ~/.arduino15/staging
          key: a13-h0-f1-alpha10-${{ runner.os }}-${{ hashFiles('JWPLC/package_jwplc_index_dev.json') }}
      - name: Instalar el mismo toolchain validado en N2
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls "https://raw.githubusercontent.com/JW-Control/platform-jwplc/main/JWPLC/package_jwplc_index_dev.json"
          arduino-cli core update-index
          arduino-cli core install 'jwplc:esp32@2.1.0-alpha.10'
      - name: Extraer valores iniciales del ELF y sdkconfig sin hardware
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/alpha13/gates/a13_h0_e1e2_verify.py --output "$RUNNER_TEMP/a13-h0-e1e2"
      - name: Adjuntar manifiesto de evidencias sin ELF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a13-h0-e1e2-${{ github.run_id }}
          path: ${{ runner.temp }}/a13-h0-e1e2/
          if-no-files-found: warn
          retention-days: 14
