name: Alpha11 normalize modern Display examples

on:
  push:
    branches:
      - v2.1.0-alpha.11/feature/hmi-designer
    paths:
      - ".github/workflows/alpha11-migrate-modern-display-api.yml"

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalizar formato y verificar API pública
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = {
              'tetris': Path('JWPLC/2.1.0/libraries/JWPLC_Display/examples/Display_Tetris/Display_Tetris.ino'),
              'flappy': Path('JWPLC/2.1.0/libraries/JWPLC_Display/examples/Display_FlappyBird/Display_FlappyBird.ino'),
          }

          s = files['tetris'].read_text(encoding='utf-8')
          s, c1 = re.subn(r'(?m)^if \(JWPLC_Buttons\.pressed\(BTN_OK\)\)',
                          '  if (JWPLC_Buttons.pressed(BTN_OK))', s, count=1)
          s, c2 = re.subn(r'(?m)^if \(\(uint32_t\)\(now - userEnterMs\)',
                          '    if ((uint32_t)(now - userEnterMs)', s, count=1)
          if c1 != 1 or c2 != 1:
              raise SystemExit(f'Tetris: formato esperado no encontrado ({c1}, {c2})')
          files['tetris'].write_text(s, encoding='utf-8', newline='\n')

          s = files['flappy'].read_text(encoding='utf-8')
          s, c1 = re.subn(r'(?m)^birdV100 \+=', '  birdV100 +=', s, count=1)
          s, c2 = re.subn(r'(?m)^if \(\(uint32_t\)\(now - userEnterMs\)',
                          '    if ((uint32_t)(now - userEnterMs)', s, count=1)
          if c1 != 1 or c2 != 1:
              raise SystemExit(f'Flappy: formato esperado no encontrado ({c1}, {c2})')
          files['flappy'].write_text(s, encoding='utf-8', newline='\n')

          offenders = []
          for base in Path('JWPLC/2.1.0/libraries').glob('*/examples'):
              for p in base.rglob('*.ino'):
                  text = p.read_text(encoding='utf-8', errors='ignore')
                  if 'jwplcUserDisplay' in text:
                      offenders.append(str(p))
          if offenders:
              raise SystemExit('API Display legacy presente:\n' + '\n'.join(offenders))

          for p in files.values():
              text = p.read_text(encoding='utf-8')
              for required in ('jwplcUIEnter', 'jwplcUIUpdate', 'jwplcUIExit'):
                  if required not in text:
                      raise SystemExit(f'{p}: falta {required}')

          print('ALPHA11_EXAMPLES_MODERN_DISPLAY_API=PASS')
          print('ALPHA11_EXAMPLES_FORMAT=PASS')
          PY

          git diff --check
          git diff --stat

      - name: Commit de formato
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Sin cambios pendientes"
            exit 0
          fi
          git config user.name "JW-Control Actions"
          git config user.email "jw.control.peru@gmail.com"
          git add JWPLC/2.1.0/libraries/JWPLC_Display/examples/Display_Tetris/Display_Tetris.ino
          git add JWPLC/2.1.0/libraries/JWPLC_Display/examples/Display_FlappyBird/Display_FlappyBird.ino
          git commit -m "style(alpha11): limpiar formato de ejemplos Display"
          git push origin HEAD:v2.1.0-alpha.11/feature/hmi-designer
