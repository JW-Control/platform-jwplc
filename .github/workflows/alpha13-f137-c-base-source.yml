name: Alpha13 F137-C - verificar source integrado BASE sin release

on:
  push:
    branches:
      - v2.1.0-alpha.13/feature/cleanup-robustness
    paths:
      - docs/v2.1.0-alpha.13/ALPHA13_STATUS.md
      - docs/v2.1.0-alpha.13/PRE_RELEASE.md
      - docs/v2.1.0-alpha.13/A13_RELEASE_SOURCE_DECISION_20261020.md
      - tools/alpha13/f137_c_release_guard.py
      - .github/workflows/alpha13-f137-c-base-source.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  base-source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Confirmar SHA del source publicado a futuro, SIN publicar
        shell: pwsh
        run: |
          python -B -m py_compile tools/alpha13/f137_c_release_guard.py
          python -B tools/alpha13/f137_c_release_guard.py --selftest
          python -B tools/alpha13/f137_c_release_guard.py --verify-release-source --expected-head '${{ github.sha }}' --output (Join-Path $env:RUNNER_TEMP 'F137_BASE_SOURCE.json')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpha13-f137-base-source-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/F137_BASE_SOURCE.json
          retention-days: 14
          if-no-files-found: warn
