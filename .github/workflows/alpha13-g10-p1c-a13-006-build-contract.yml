name: Alpha13 G10 P1C - Arduino overlay build contract

on:
  push:
    branches:
      - 'v2.1.0-alpha.13/feature/cleanup-robustness'
    paths:
      - '.github/workflows/alpha13-g10-p1c-a13-006-build-contract.yml'
      - 'tools/alpha13/gates/a13_g10_p1c_a13_006_build.py'
      - 'tools/alpha13/gates/run_a13_g10_p1c_a13_006_build.bat'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-contract:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax and CLI help
        shell: pwsh
        run: |
          python -m py_compile tools/alpha13/gates/a13_g10_p1c_a13_006_build.py
          python -B tools/alpha13/gates/a13_g10_p1c_a13_006_build.py --help
          if ($LASTEXITCODE -ne 0) { throw 'G10_P1C_HELP_FAILED' }
      - name: Static contract + negative library discovery
        shell: pwsh
        run: |
          python -B tools/alpha13/gates/a13_g10_p1c_a13_006_build.py --selftest | Tee-Object -FilePath g10_p1c_selftest.log
          if ($LASTEXITCODE -ne 0) { throw 'G10_P1C_SELFTEST_FAILED' }
          if ((Get-Content g10_p1c_selftest.log -Raw) -notmatch 'G10_P1C_SELFTEST=PASS_SCOPE_SOURCE_LIBRARY_NEGATIVE') { throw 'G10_P1C_PASS_MARKER_MISSING' }
      - name: Validate unchanged product
        shell: pwsh
        run: |
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'G10_P1C_SELFTEST_MUTATED_PRODUCT' }
      - name: Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha13-g10-p1c-contract-${{ matrix.os }}-${{ github.run_id }}
          path: g10_p1c_selftest.log
          if-no-files-found: warn
