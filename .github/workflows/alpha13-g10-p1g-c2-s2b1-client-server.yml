name: Alpha13 G10 P1G-C2-S2B1 - Client Server lease and cancel

on:
  push:
    branches:
      - 'v2.1.0-alpha.13/feature/cleanup-robustness'
    paths:
      - '.github/workflows/alpha13-g10-p1g-c2-s2b1-client-server.yml'
      - 'tools/alpha13/gates/a13_g10_p1g_c2_s2b1_client_server_lease.py'
      - 'tools/alpha13/gates/run_a13_g10_p1g_c2_s2b1_client_server_lease.bat'
      - 'tools/alpha13/candidates/g10_p1g_c/native_c2_s2b_client_server_lease_test.cpp'
      - 'tools/alpha13/candidates/g10_p1g_c/JWPLC_W5500_SafeAccess.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client-server-source-witness:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Gate syntax
        shell: pwsh
        run: |
          python -m py_compile tools/alpha13/gates/a13_g10_p1g_c2_s2b1_client_server_lease.py
          python -B tools/alpha13/gates/a13_g10_p1g_c2_s2b1_client_server_lease.py --help
          if ($LASTEXITCODE -ne 0) { throw 'C2_S2B1_SYNTAX_FAILED' }
      - name: Native real Client and Server methods plus negatives
        shell: pwsh
        run: |
          python -B tools/alpha13/gates/a13_g10_p1g_c2_s2b1_client_server_lease.py --ci-standalone | Tee-Object -FilePath c2_s2b1.log
          if ($LASTEXITCODE -ne 0) { throw 'C2_S2B1_NATIVE_FAILED' }
          $s = Get-Content c2_s2b1.log -Raw
          if ($s -notmatch 'G10_P1G_C2_S2B1_POSITIVE_NATIVE=PASS_REAL_CLIENT_SERVER_TOKEN_AND_CLOSE') { throw 'C2_S2B1_POSITIVE_MISSING' }
          if ($s -notmatch 'G10_P1G_C2_S2B1_NEGATIVES=4') { throw 'C2_S2B1_NEGATIVES_MISSING' }
          if ($s -notmatch 'G10_P1G_C2_S2B1_STATUS=CLIENT_SERVER_TOKEN_CANCEL_SOURCE_NATIVE_PASS_INCOMPLETE_ADOPTION_BLOCKED') { throw 'C2_S2B1_STATUS_WRONG' }
      - name: No product edits
        shell: pwsh
        run: |
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'PRODUCT_MUTATED_C2_S2B1' }
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha13-c2-s2b1-${{ matrix.os }}-${{ github.run_id }}
          path: |
            c2_s2b1.log
            tools/alpha13/results/g10_p1g_c2_s2b1_*/
          if-no-files-found: warn
