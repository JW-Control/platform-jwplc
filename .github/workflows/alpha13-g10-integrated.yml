name: Alpha13 G10 - preparacion integrada de fuentes y brechas
on:
  push:
    branches:
      - 'v2.1.0-alpha.13/feature/cleanup-robustness'
    paths:
      - '.github/workflows/alpha13-g10-integrated.yml'
      - 'tools/alpha13/gates/a13_g10_integrated.py'
      - 'tools/alpha13/gates/run_a13_g10_integrated.bat'
      - 'tools/alpha13/gates/a13_g10_p1g_c2_*.py'
      - 'tools/alpha13/gates/a13_g10_p1g_a_mutex_callpaths.py'
      - 'tools/alpha13/gates/a13_g10_p1a_a13_006_repro.py'
      - 'tools/alpha13/candidates/g10_p1g_c/**'
      - 'JWPLC/2.1.0/libraries/JWPLC_Ethernet/src/**'
      - 'JWPLC/2.1.0/libraries/JWPLC_ModbusTCP/src/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  overlay-compose:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python syntax
        shell: pwsh
        run: |
          python -m py_compile tools/alpha13/gates/a13_g10_integrated.py
          python -B tools/alpha13/gates/a13_g10_integrated.py --help
          if ($LASTEXITCODE -ne 0) { throw 'G10_I_SYNTAX' }
      - name: Componer overlays aislados y comprobar freeze
        shell: pwsh
        run: |
          python -B tools/alpha13/gates/a13_g10_integrated.py --ci-standalone | Tee-Object -FilePath g10_i.log
          if ($LASTEXITCODE -ne 0) { throw 'G10_I_PREPARATION_FAIL' }
          $log=Get-Content g10_i.log -Raw
          if ($log -notmatch 'G10_INTEGRATED_SOURCE_OVERLAY=COMPOSED') { throw 'G10_I_NO_OVERLAY' }
          if ($log -notmatch 'G10_INTEGRATED_TRISTATE_STATUS_NATIVE=PASS_PRIMITIVE_ONLY') { throw 'G10_I_TRISTATE_NATIVE_NOT_PROVEN' }
          if ($log -notmatch 'G10_INTEGRATED_MODBUS_CLEANUP_NATIVE=PASS_THREE_SOURCE_METHODS_3_NEGATIVES') { throw 'G10_I_MODBUS_CLEANUP_NOT_PROVEN' }
          if ($log -notmatch 'G10_INTEGRATED_MODBUS_SERVER_CLEANUP_NATIVE=PASS_THREE_SOURCE_METHODS_5_NEGATIVES') { throw 'G10_I_MODBUS_SERVER_NOT_PROVEN' }
          if ($log -notmatch 'G10_INTEGRATED_BLOCKERS=8') { throw 'G10_I_RISK_MASKED' }
          if ($log -notmatch 'G10_INTEGRATED_STATUS=COMPOSED_REVIEW_BLOCKED') { throw 'G10_I_WRONG_STATUS' }
          if ($log -notmatch 'G10_INTEGRATED_PRODUCT_CHANGED=NO') { throw 'G10_I_PRODUCT_CHANGED' }
      - name: No tocar fuentes productivas
        shell: pwsh
        run: |
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'G10_I_TRACKED_DIRTY' }
      - name: Evidencia de preparacion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha13-g10-i-${{ matrix.os }}-${{ github.run_id }}
          path: |
            g10_i.log
            tools/alpha13/results/g10_i_*/
          if-no-files-found: warn


  arduino-review:
    name: Arduino CLI - bibliotecas baseline vs candidato (bootstrap intacto)
    runs-on: ubuntu-latest
    needs: overlay-compose
    timeout-minutes: 50
    env:
      JWPLC_INDEX_URL: https://raw.githubusercontent.com/JW-Control/platform-jwplc/main/JWPLC/package_jwplc_index_dev.json
      JWPLC_BOOTSTRAP_VERSION: 2.1.0-alpha.10
      JWPLC_FQBN: jwplc:esp32:jwplcbasic
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.x'
      - name: Cache toolchain inmutable
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15/packages/jwplc
            ~/.arduino15/staging
          key: g10i-immutable-${{ runner.os }}-${{ env.JWPLC_BOOTSTRAP_VERSION }}-${{ hashFiles('JWPLC/package_jwplc_index_dev.json') }}
      - name: Bootstrap del toolchain Arduino
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls "$JWPLC_INDEX_URL"
          arduino-cli core update-index
          arduino-cli core install "jwplc:esp32@$JWPLC_BOOTSTRAP_VERSION"
          arduino-cli board listall "$JWPLC_FQBN"
      - name: Preparar overlay sin alterar core instalado
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/g10-evidence"
          python -B tools/alpha13/gates/a13_g10_integrated.py --ci-standalone \
            --stage-platform "$RUNNER_TEMP/g10-candidate-platform" \
            | tee "$RUNNER_TEMP/g10-evidence/stage.log"
          grep -F 'G10_INTEGRATED_ARDUINO_PLATFORM_EXPORT=STAGED_NOT_COMPILED' \
            "$RUNNER_TEMP/g10-evidence/stage.log"
          test -f "$RUNNER_TEMP/g10-candidate-platform/libraries/JWPLC_Ethernet/src/JWPLC_W5500_SafeAccess.cpp"
          # No rsync hacia ~/.arduino15: las alteraciones de boards.txt/platform.txt
          # invalidan la instancia CLI (error independiente del firmware).
          echo 'G10_I_CORE_INSTALLED=UNCHANGED'
      - name: Compilar baseline y candidato contra el MISMO bootstrap inmutable
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          BASE="$ROOT/JWPLC/2.1.0/libraries"
          CAND="$RUNNER_TEMP/g10-candidate-platform/libraries"
          EVIDENCE="$RUNNER_TEMP/g10-evidence"
          sketches=(
            "JWPLC/2.1.0/libraries/JWPLC_ModbusTCP/examples/01.ModbusTCP_Server"
            "JWPLC/2.1.0/libraries/JWPLC_Ethernet/examples/Ethernet_SPI_Coexistence"
          )
          for version in baseline candidate; do
            case "$version" in
              baseline) selected="$BASE" ;;
              candidate) selected="$CAND" ;;
            esac
            for sketch in "${sketches[@]}"; do
              name="$(basename "$sketch")"
              log="$EVIDENCE/$version-$name.log"
              output="$RUNNER_TEMP/g10-$version-$name"
              echo "::group::$version $name"
              # Explicit --library tiene prioridad sobre el discovery de bibliotecas.
              arduino-cli compile --fqbn "$JWPLC_FQBN" --warnings default \
                --libraries "$BASE" \
                --library "$selected/JWPLC_Ethernet" \
                --library "$selected/JWPLC_ModbusTCP" \
                --build-property "compiler.cpp.extra_flags=-I$ROOT/JWPLC/2.1.0/cores/jwcontrol" \
                --build-path "$output" --clean -v \
                "$ROOT/$sketch" >"$log" 2>&1 || {
                  grep -En 'error:|fatal error|undefined reference|Error during build' "$log" | tail -n 24 || true
                  tail -n 25 "$log"
                  echo "G10_I_ARDUINO_$version=FAILED_NOT_FULL_ALPHA13"
                  exit 32
                }
              eth_lib="$(grep -F 'Using library JWPLC_Ethernet' "$log" | tail -n 1)"
              echo "$eth_lib"
              if [[ "$eth_lib" != *"in folder: $selected/JWPLC_Ethernet"* ]]; then
                echo "G10_I_WRONG_ETH_LIBRARY_SELECTED=$version/$name"
                exit 34
              fi
              if [ "$name" = '01.ModbusTCP_Server' ]; then
                tcp_lib="$(grep -F 'Using library JWPLC_ModbusTCP' "$log" | tail -n 1)"
                echo "$tcp_lib"
                if [[ "$tcp_lib" != *"in folder: $selected/JWPLC_ModbusTCP"* ]]; then
                  echo "G10_I_WRONG_TCP_LIBRARY_SELECTED=$version/$name"
                  exit 35
                fi
              fi
              if [ "$version" = candidate ]; then
                mapfile -t objs < <(find "$output" -name 'JWPLC_W5500_SafeAccess.cpp.o' -type f)
                if [ "${#objs[@]}" -ne 1 ]; then
                  echo 'G10_I_CANDIDATE_SAFEACCESS_OBJECT_NOT_UNIQUE'
                  exit 33
                fi
                printf '%s\n' "${objs[@]}" >"$EVIDENCE/object-$name.txt"
                obj="${objs[0]}"
                # -MMD from platform.txt: prueba fuente real del objeto GCC,
                # no solamente que el nombre del objeto exista.
                dep="${obj%.o}.d"
                if [ ! -f "$dep" ]; then
                  dep="$obj.d"
                fi
                test -f "$dep" || { echo "G10_I_MMD_DEPENDENCY_MISSING"; exit 36; }
                if ! grep -Fq "$CAND/JWPLC_Ethernet/src/JWPLC_W5500_SafeAccess.cpp" "$dep"; then
                  echo "G10_I_WRONG_OBJECT_SOURCE_MMD"
                  exit 37
                fi
                mapfile -t elfs < <(find "$output" -maxdepth 1 -type f -name '*.elf')
                if [ "${#elfs[@]}" -ne 1 ]; then
                  echo "G10_I_ELF_NOT_UNIQUE"
                  exit 38
                fi
                toolnm="$(find "$HOME/.arduino15/packages/jwplc/tools" -type f -name 'xtensa-esp32-elf-nm' -print -quit)"
                test -n "$toolnm" && test -x "$toolnm" || {
                  echo "G10_I_TARGET_NM_MISSING"
                  exit 39
                }
                "$toolnm" -C "${elfs[0]}" >"$EVIDENCE/nm-$name.txt"
                # Debe encontrarse en el ejecutable enlazado, no únicamente
                # en un archivo .o que podría quedar descartado.
                grep -Fq 'jwplc_w5500_candidate::enter(' "$EVIDENCE/nm-$name.txt" || {
                  echo "G10_I_SAFEACCESS_ENTER_NOT_IN_ELF"
                  exit 40
                }
                grep -Fq 'jwplc_w5500_candidate::leave()' "$EVIDENCE/nm-$name.txt" || {
                  echo "G10_I_SAFEACCESS_LEAVE_NOT_IN_ELF"
                  exit 41
                }
                sha256sum "$obj" "${elfs[0]}" >"$EVIDENCE/object-elf-sha-$name.txt"
                echo "G10_I_SOURCE_TO_OBJECT_MMD_AND_ELF_$name=PASS"
              fi
              echo "G10_I_ARDUINO_${version}_$name=PASS_BOOTSTRAP_LIBRARIES_ONLY"
              echo "::endgroup::"
            done
          done
          echo 'G10_I_ARDUINO_LIBRARY_BASELINE_CANDIDATE=PASS_NOT_FULL_PLATFORM'
      - name: Evidencia de compilacion sin publicar binarios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g10-i-arduino-review-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/g10-evidence/
          if-no-files-found: warn
          retention-days: 14
