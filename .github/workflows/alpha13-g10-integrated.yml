name: Alpha13 G10 - preparacion integrada de fuentes y brechas
on:
  push:
    branches:
      - 'v2.1.0-alpha.13/feature/cleanup-robustness'
      - 'codex/alpha13-g10-*'
    paths:
      - '.github/workflows/alpha13-g10-integrated.yml'
      - 'tools/alpha13/gates/a13_g10_integrated.py'
      - 'tools/alpha13/gates/a13_g10_b03_source_contract.py'
      - 'tools/alpha13/gates/run_a13_g10_integrated.bat'
      - 'tools/alpha13/gates/a13_g10_p1g_c2_*.py'
      - 'tools/alpha13/gates/a13_g10_p1g_a_mutex_callpaths.py'
      - 'tools/alpha13/gates/a13_g10_p1a_a13_006_repro.py'
      - 'tools/alpha13/candidates/g10_p1g_c/**'
      - 'tools/alpha13/sketches/**'
      - 'JWPLC/2.1.0/libraries/JWPLC_Ethernet/src/**'
      - 'JWPLC/2.1.0/libraries/JWPLC_ModbusTCP/src/**'
  workflow_dispatch:
    inputs:
      regression_level:
        description: 'N2 compacto o N3 con los 11 sketches baseline/candidato'
        type: choice
        required: true
        default: full
        options:
          - compact
          - full
permissions:
  contents: read
jobs:
  overlay-compose:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Python syntax
        shell: pwsh
        run: |
          python -m py_compile tools/alpha13/gates/a13_g10_integrated.py
          python -B tools/alpha13/gates/a13_g10_integrated.py --help
          if ($LASTEXITCODE -ne 0) { throw 'G10_I_SYNTAX' }
      - name: Verificar ruta candidata B03 y mutaciones de contrato
        shell: pwsh
        run: |
          python -B tools/alpha13/gates/a13_g10_b03_source_contract.py
          if ($LASTEXITCODE -ne 0) { throw 'G10_I_B03_SOURCE_CONTRACT_DRIFT' }
      - name: Componer overlays aislados y comprobar freeze
        shell: pwsh
        run: |
          python -B tools/alpha13/gates/a13_g10_integrated.py --ci-standalone | Tee-Object -FilePath g10_i.log
          if ($LASTEXITCODE -ne 0) { throw 'G10_I_PREPARATION_FAIL' }
          $log=Get-Content g10_i.log -Raw
          if ($log -notmatch 'G10_INTEGRATED_SOURCE_OVERLAY=COMPOSED') { throw 'G10_I_NO_OVERLAY' }
          if ($log -notmatch 'G10_INTEGRATED_TRISTATE_STATUS_NATIVE=PASS_PRIMITIVE_ONLY') { throw 'G10_I_TRISTATE_NATIVE_NOT_PROVEN' }
          if ($log -notmatch 'G10_INTEGRATED_MODBUS_CLEANUP_NATIVE=PASS_THREE_SOURCE_METHODS_3_NEGATIVES') { throw 'G10_I_MODBUS_CLEANUP_NOT_PROVEN' }
          if ($log -notmatch 'G10_INTEGRATED_MODBUS_SERVER_CLEANUP_NATIVE=PASS_THREE_SOURCE_METHODS_5_NEGATIVES') { throw 'G10_I_MODBUS_SERVER_NOT_PROVEN' }
          if ($log -notmatch 'G10_INTEGRATED_B02_UDP_IO=PASS_SOURCE_BACKED_7_METHODS_3_NEGATIVES') { throw 'G10_I_B02_UDP_IO_NOT_PROVEN' }
          if ($log -notmatch 'G10_INTEGRATED_B03_DNS_DHCP_SHUTDOWN=PASS_SOURCE_BACKED_DEFERRED_CLOSE_9_NEGATIVES') { throw 'G10_I_B03_CORRECTION_NOT_DEMONSTRATED' }
          if ($log -notmatch 'G10_INTEGRATED_BLOCKERS=8') { throw 'G10_I_RISK_MASKED' }
          if ($log -notmatch 'G10_INTEGRATED_STATUS=B03_CANDIDATE_REVIEW_BLOCKED') { throw 'G10_I_WRONG_STATUS' }
          if ($log -notmatch 'G10_INTEGRATED_PRODUCT_CHANGED=NO') { throw 'G10_I_PRODUCT_CHANGED' }
      - name: No tocar fuentes productivas
        shell: pwsh
        run: |
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'G10_I_TRACKED_DIRTY' }
      - name: Evidencia de preparacion
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: alpha13-g10-i-${{ matrix.os }}-${{ github.run_id }}
          path: |
            g10_i.log
            tools/alpha13/results/g10_i_*/
          if-no-files-found: warn


  arduino-review:
    name: Arduino CLI - bibliotecas baseline vs candidato (bootstrap intacto)
    runs-on: ubuntu-24.04
    needs: overlay-compose
    timeout-minutes: 50
    env:
      JWPLC_INDEX_URL: https://raw.githubusercontent.com/JW-Control/platform-jwplc/main/JWPLC/package_jwplc_index_dev.json
      JWPLC_BOOTSTRAP_VERSION: 2.1.0-alpha.10
      JWPLC_FQBN: jwplc:esp32:jwplcbasic
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.x'
      - name: Cache toolchain inmutable
        uses: actions/cache@v5
        with:
          path: |
            ~/.arduino15/packages/jwplc
            ~/.arduino15/staging
          key: g10i-immutable-${{ runner.os }}-${{ env.JWPLC_BOOTSTRAP_VERSION }}-${{ hashFiles('JWPLC/package_jwplc_index_dev.json') }}
      - name: Bootstrap del toolchain Arduino
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls "$JWPLC_INDEX_URL"
          arduino-cli core update-index
          arduino-cli core install "jwplc:esp32@$JWPLC_BOOTSTRAP_VERSION"
          arduino-cli board listall "$JWPLC_FQBN"
      - name: Preparar overlay sin alterar core instalado
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/g10-evidence"
          python -B tools/alpha13/gates/a13_g10_integrated.py --ci-standalone \
            --stage-platform "$RUNNER_TEMP/g10-candidate-platform" \
            | tee "$RUNNER_TEMP/g10-evidence/stage.log"
          grep -F 'G10_INTEGRATED_ARDUINO_PLATFORM_EXPORT=STAGED_NOT_COMPILED' \
            "$RUNNER_TEMP/g10-evidence/stage.log"
          test -f "$RUNNER_TEMP/g10-candidate-platform/libraries/JWPLC_Ethernet/src/JWPLC_W5500_SafeAccess.cpp"
          # No rsync hacia ~/.arduino15: las alteraciones de boards.txt/platform.txt
          # invalidan la instancia CLI (error independiente del firmware).
          echo 'G10_I_CORE_INSTALLED=UNCHANGED'
      - name: Compilar baseline y candidato contra el MISMO bootstrap inmutable
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          BASE="$ROOT/JWPLC/2.1.0/libraries"
          CAND="$RUNNER_TEMP/g10-candidate-platform/libraries"
          EVIDENCE="$RUNNER_TEMP/g10-evidence"
          sketches=(
            "JWPLC/2.1.0/libraries/JWPLC_ModbusTCP/examples/01.ModbusTCP_Server"
            "JWPLC/2.1.0/libraries/JWPLC_Ethernet/examples/Ethernet_SPI_Coexistence"
            "JWPLC/2.1.0/libraries/JWPLC_Ethernet/examples/01.Ethernet_DHCP_Basic"
            "tools/alpha13/sketches/G10_UDP_DNS_DHCP_Integration"
          )
          for version in baseline candidate; do
            case "$version" in
              baseline) selected="$BASE" ;;
              candidate) selected="$CAND" ;;
            esac
            for sketch in "${sketches[@]}"; do
              name="$(basename "$sketch")"
              log="$EVIDENCE/$version-$name.log"
              output="$RUNNER_TEMP/g10-$version-$name"
              echo "::group::$version $name"
              # Explicit --library tiene prioridad sobre el discovery de bibliotecas.
              arduino-cli compile --fqbn "$JWPLC_FQBN" --warnings default \
                --libraries "$BASE" \
                --library "$selected/JWPLC_Ethernet" \
                --library "$selected/JWPLC_ModbusTCP" \
                --build-property "compiler.cpp.extra_flags=-I$ROOT/JWPLC/2.1.0/cores/jwcontrol" \
                --build-path "$output" --clean -v \
                "$ROOT/$sketch" >"$log" 2>&1 || {
                  grep -En 'error:|fatal error|undefined reference|Error during build' "$log" | tail -n 24 || true
                  tail -n 25 "$log"
                  echo "G10_I_ARDUINO_$version=FAILED_NOT_FULL_ALPHA13"
                  exit 32
                }
              eth_lib="$(grep -F 'Using library JWPLC_Ethernet' "$log" | tail -n 1)"
              echo "$eth_lib"
              if [[ "$eth_lib" != *"in folder: $selected/JWPLC_Ethernet"* ]]; then
                echo "G10_I_WRONG_ETH_LIBRARY_SELECTED=$version/$name"
                exit 34
              fi
              if [ "$name" = '01.ModbusTCP_Server' ]; then
                tcp_lib="$(grep -F 'Using library JWPLC_ModbusTCP' "$log" | tail -n 1)"
                echo "$tcp_lib"
                if [[ "$tcp_lib" != *"in folder: $selected/JWPLC_ModbusTCP"* ]]; then
                  echo "G10_I_WRONG_TCP_LIBRARY_SELECTED=$version/$name"
                  exit 35
                fi
              fi
              if [ "$version" = candidate ]; then
                mapfile -t objs < <(find "$output" -name 'JWPLC_W5500_SafeAccess.cpp.o' -type f)
                if [ "${#objs[@]}" -ne 1 ]; then
                  echo 'G10_I_CANDIDATE_SAFEACCESS_OBJECT_NOT_UNIQUE'
                  exit 33
                fi
                printf '%s\n' "${objs[@]}" >"$EVIDENCE/object-$name.txt"
                obj="${objs[0]}"
                # -MMD from platform.txt: prueba fuente real del objeto GCC,
                # no solamente que el nombre del objeto exista.
                dep="${obj%.o}.d"
                if [ ! -f "$dep" ]; then
                  dep="$obj.d"
                fi
                test -f "$dep" || { echo "G10_I_MMD_DEPENDENCY_MISSING"; exit 36; }
                if ! grep -Fq "$CAND/JWPLC_Ethernet/src/JWPLC_W5500_SafeAccess.cpp" "$dep"; then
                  echo "G10_I_WRONG_OBJECT_SOURCE_MMD"
                  exit 37
                fi
                mapfile -t elfs < <(find "$output" -maxdepth 1 -type f -name '*.elf')
                if [ "${#elfs[@]}" -ne 1 ]; then
                  echo "G10_I_ELF_NOT_UNIQUE"
                  exit 38
                fi
                toolnm="$(find "$HOME/.arduino15/packages/jwplc/tools" -type f -name 'xtensa-esp32-elf-nm' -print -quit)"
                test -n "$toolnm" && test -x "$toolnm" || {
                  echo "G10_I_TARGET_NM_MISSING"
                  exit 39
                }
                "$toolnm" -C "${elfs[0]}" >"$EVIDENCE/nm-$name.txt"
                # Debe encontrarse en el ejecutable enlazado, no únicamente
                # en un archivo .o que podría quedar descartado.
                grep -Fq 'jwplc_w5500_candidate::enter(' "$EVIDENCE/nm-$name.txt" || {
                  echo "G10_I_SAFEACCESS_ENTER_NOT_IN_ELF"
                  exit 40
                }
                grep -Fq 'jwplc_w5500_candidate::leave()' "$EVIDENCE/nm-$name.txt" || {
                  echo "G10_I_SAFEACCESS_LEAVE_NOT_IN_ELF"
                  exit 41
                }
                if [ "$name" = 'G10_UDP_DNS_DHCP_Integration' ]; then
                  # B03 must use the staged UDP, DNS, DHCP and autoload
                  # sources, not merely a SafeAccess object with mock users.
                  for stem in EthernetUdp.cpp Dns.cpp Dhcp.cpp JWPLC_Ethernet.cpp; do
                    mapfile -t b03objs < <(find "$output" -name "$stem.o" -type f)
                    if [ "${#b03objs[@]}" -ne 1 ]; then
                      echo "G10_I_B03_OBJECT_NOT_UNIQUE=$stem"
                      exit 42
                    fi
                    b03dep="${b03objs[0]%.o}.d"
                    test -f "$b03dep" || { echo "G10_I_B03_MMD_MISSING=$stem"; exit 43; }
                    grep -Fq "$CAND/JWPLC_Ethernet/src/$stem" "$b03dep" || {
                      echo "G10_I_B03_WRONG_OBJECT_SOURCE=$stem"
                      exit 44
                    }
                    sha256sum "${b03objs[0]}" >>"$EVIDENCE/b03-object-sha-$name.txt"
                  done
                  for symbol in 'EthernetUDP::jwplcServiceDeferredClose()' \
                                'jwplc_w5500_candidate::serviceDeferredClose(' \
                                'DNSClient::finishResolveAsync(int)' \
                                'DhcpClass::finishAsync()'; do
                    grep -Fq "$symbol" "$EVIDENCE/nm-$name.txt" || {
                      echo "G10_I_B03_SYMBOL_NOT_IN_ELF=$symbol"
                      exit 45
                    }
                  done
                  for symbol in 'EthernetUDP::write(unsigned char const*,' \
                                'EthernetUDP::parsePacket()' \
                                'EthernetUDP::read(unsigned char*,'; do
                    grep -Fq "$symbol" "$EVIDENCE/nm-$name.txt" || {
                      echo "G10_I_B02_UDP_SYMBOL_NOT_IN_ELF=$symbol"
                      exit 46
                    }
                  done
                  echo 'G10_I_B02_UDP_SOURCE_TO_OBJECT_MMD_AND_ELF=PASS'
                  echo 'G10_I_B03_SOURCE_TO_OBJECT_MMD_AND_ELF=PASS_4_SOURCES'
                fi
                sha256sum "$obj" "${elfs[0]}" >"$EVIDENCE/object-elf-sha-$name.txt"
                echo "G10_I_SOURCE_TO_OBJECT_MMD_AND_ELF_$name=PASS"
              fi
              echo "G10_I_ARDUINO_${version}_$name=PASS_BOOTSTRAP_LIBRARIES_ONLY"
              echo "::endgroup::"
            done
          done
          echo 'G10_I_ARDUINO_LIBRARY_BASELINE_CANDIDATE=PASS_NOT_FULL_PLATFORM'
      - name: Evidencia de compilacion sin publicar binarios
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: g10-i-arduino-review-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/g10-evidence/
          if-no-files-found: warn
          retention-days: 14

  full-platform-review:
    # N3: cierre/integración integral, nunca en cada push pequeño de Ethernet.
    # En este cambio se preserva manual con workflow_dispatch=full.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.regression_level == 'full' }}
    name: Alpha13 package completo aislado - ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    needs: overlay-compose
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, candidate]
    env:
      JWPLC_INDEX_URL: https://raw.githubusercontent.com/JW-Control/platform-jwplc/main/JWPLC/package_jwplc_index_dev.json
      JWPLC_BOOTSTRAP_VERSION: 2.1.0-alpha.10
      JWPLC_FQBN: jwplc_local:esp32:jwplcbasic
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.x'
      - name: Cache toolchain sin mutar
        uses: actions/cache@v5
        with:
          path: |
            ~/.arduino15/packages/jwplc
            ~/.arduino15/staging
          key: g10i-full-${{ runner.os }}-alpha10-${{ hashFiles('JWPLC/package_jwplc_index_dev.json') }}
      - name: Instalar herramientas y core bootstrap
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls "$JWPLC_INDEX_URL"
          arduino-cli core update-index
          arduino-cli core install "jwplc:esp32@$JWPLC_BOOTSTRAP_VERSION"
      - name: Preparar hardware sketchbook aislado sin cambiar el core instalado
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/g10-full-${{ matrix.variant }}"
          SRC="$GITHUB_WORKSPACE/JWPLC/2.1.0"
          mkdir -p "$WORK/sketchbook/hardware/jwplc_local/esp32" "$WORK/evidence"
          if [ "${{ matrix.variant }}" = candidate ]; then
            python -B tools/alpha13/gates/a13_g10_integrated.py --ci-standalone \
              --stage-platform "$RUNNER_TEMP/g10-full-candidate-platform" \
              >"$WORK/evidence/compose.log"
            SRC="$RUNNER_TEMP/g10-full-candidate-platform"
            grep -F 'G10_INTEGRATED_STATUS=B03_CANDIDATE_REVIEW_BLOCKED' "$WORK/evidence/compose.log"
          fi
          rsync -a "$SRC/" "$WORK/sketchbook/hardware/jwplc_local/esp32/"
          cmp "$SRC/boards.txt" "$WORK/sketchbook/hardware/jwplc_local/esp32/boards.txt"
          cmp "$SRC/platform.txt" "$WORK/sketchbook/hardware/jwplc_local/esp32/platform.txt"
          # Verificar paridad de todos los archives; ninguno se recompila,
          # sustituye ni altera en este job.
          while IFS= read -r -d '' archive; do
            relative="${archive#"$GITHUB_WORKSPACE/JWPLC/2.1.0/"}"
            cmp "$GITHUB_WORKSPACE/JWPLC/2.1.0/$relative" \
              "$WORK/sketchbook/hardware/jwplc_local/esp32/$relative"
          done < <(find "$GITHUB_WORKSPACE/JWPLC/2.1.0" -type f -name '*.a' -print0)
          arduino-cli config set directories.user "$WORK/sketchbook"
          arduino-cli board details --fqbn "$JWPLC_FQBN" \
            >"$WORK/evidence/board.txt"
          test -f "$WORK/sketchbook/hardware/jwplc_local/esp32/precompiled/core/JWPLCBASIC/core.a"
          echo "G10_I_FULL_VARIANT=${{ matrix.variant }}"
          echo "G10_I_FULL_ARCHIVES=UNCHANGED"
      - name: Compilación package completo y comprobación de plataforma
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/g10-full-${{ matrix.variant }}"
          HARDWARE="$WORK/sketchbook/hardware/jwplc_local/esp32"
          EVIDENCE="$WORK/evidence"
          # Compilar la MISMA matriz sobre baseline y candidato.
          # Todos los sketches y rutas se verificaron en la rama Alpha13.
          sketches=(
            "JWPLC/2.1.0/libraries/JWPLC_GlobalPeripherals/examples/01.DigitalIO_Basic"
            "JWPLC/2.1.0/libraries/JWPLC_GlobalPeripherals/examples/02.Buttons_Basic"
            "JWPLC/2.1.0/libraries/JWPLC_GlobalPeripherals/examples/03.RTC_Basic"
            "JWPLC/2.1.0/libraries/JWPLC_GlobalPeripherals/examples/04.FRAM_Basic"
            "JWPLC/2.1.0/libraries/JWPLC_GlobalPeripherals/examples/05.microSD_Basic"
            "JWPLC/2.1.0/libraries/JWPLC_RS485/examples/03.RS485_Status"
            "JWPLC/2.1.0/libraries/JWPLC_ModbusRTU/examples/01.ModbusRTU_Slave_Holding"
            "JWPLC/2.1.0/libraries/JWPLC_Display/examples/01.Display_IDLE_Status"
            "JWPLC/2.1.0/libraries/JWPLC_Ethernet/examples/01.Ethernet_DHCP_Basic"
            "JWPLC/2.1.0/libraries/JWPLC_ModbusTCP/examples/01.ModbusTCP_Server"
            "JWPLC/2.1.0/libraries/JWPLC_ModbusTCP/examples/02.ModbusTCP_Client"
          )
          for sketch in "${sketches[@]}"; do
            label="$(basename "$sketch")"
            properties="$EVIDENCE/properties-$label.txt"
            arduino-cli compile --fqbn "$JWPLC_FQBN" \
              --show-properties "$GITHUB_WORKSPACE/$sketch" >"$properties"
            if ! grep -Fq "runtime.platform.path=$HARDWARE" "$properties"; then
              echo 'G10_I_FULL_PLATFORM_NOT_SELECTED'
              grep -E 'runtime.platform.path|build.core|build.extra_libs' "$properties" | head -n 25 || true
              exit 46
            fi
            arduino-cli compile --fqbn "$JWPLC_FQBN" --warnings default \
              --build-path "$WORK/build-$label" --clean -v \
              "$GITHUB_WORKSPACE/$sketch" >"$EVIDENCE/compile-$label.log" 2>&1 || {
                grep -En 'error:|fatal error|undefined reference|Error during build|no such file' \
                  "$EVIDENCE/compile-$label.log" | tail -n 28 || true
                tail -n 30 "$EVIDENCE/compile-$label.log"
                echo "G10_I_FULL_PLATFORM_BUILD=FAILED_${{ matrix.variant }}"
                exit 47
              }
            # No basta el PASS de build: exigir la biblioteca Ethernet de
            # ESTE package Alpha13, no una instalada accidentalmente.
            if ! grep -F 'Using library JWPLC_Ethernet ' "$EVIDENCE/compile-$label.log" \
              | grep -Fq "in folder: $HARDWARE/libraries/JWPLC_Ethernet"; then
              echo "G10_I_FULL_WRONG_ETHERNET_LIBRARY=${{ matrix.variant }}/$label"
              exit 49
            fi
            if [ "$label" = "01.ModbusTCP_Server" ]; then
              if ! grep -F 'Using library JWPLC_ModbusTCP ' "$EVIDENCE/compile-$label.log" \
                | grep -Fq "in folder: $HARDWARE/libraries/JWPLC_ModbusTCP"; then
                echo "G10_I_FULL_WRONG_MODBUSTCP_LIBRARY=${{ matrix.variant }}/$label"
                exit 50
              fi
            fi
            if [ "${{ matrix.variant }}" = candidate ]; then
              mapfile -t objects < <(find "$WORK/build-$label" -type f \
                -name 'JWPLC_W5500_SafeAccess.cpp.o')
              if [ "${#objects[@]}" -ne 1 ]; then
                echo "G10_I_FULL_CANDIDATE_OBJECT_NOT_UNIQUE"
                exit 48
              fi
              obj="${objects[0]}"
              printf '%s\n' "$obj" >"$EVIDENCE/obj-$label.txt"
              dep="${obj%.o}.d"
              if [ ! -f "$dep" ]; then dep="$obj.d"; fi
              test -f "$dep" || {
                echo "G10_I_FULL_CANDIDATE_MMD_NOT_FOUND"
                exit 51
              }
              if ! grep -Fq "$HARDWARE/libraries/JWPLC_Ethernet/src/JWPLC_W5500_SafeAccess.cpp" "$dep"; then
                echo "G10_I_FULL_CANDIDATE_MMD_WRONG_SOURCE"
                exit 52
              fi
              mapfile -t elfs < <(find "$WORK/build-$label" -maxdepth 1 -type f -name '*.elf')
              if [ "${#elfs[@]}" -ne 1 ]; then
                echo "G10_I_FULL_CANDIDATE_ELF_NOT_UNIQUE"
                exit 53
              fi
              nmtool="$(find "$HOME/.arduino15/packages/jwplc/tools" -type f -name 'xtensa-esp32-elf-nm' -print -quit)"
              test -n "$nmtool" && test -x "$nmtool" || {
                echo "G10_I_FULL_CANDIDATE_NM_NOT_FOUND"
                exit 54
              }
              "$nmtool" -C "${elfs[0]}" >"$EVIDENCE/nm-$label.txt"
              grep -Fq 'jwplc_w5500_candidate::enter(' "$EVIDENCE/nm-$label.txt" || {
                echo "G10_I_FULL_CANDIDATE_ENTER_ABSENT_IN_ELF"
                exit 55
              }
              grep -Fq 'jwplc_w5500_candidate::leave()' "$EVIDENCE/nm-$label.txt" || {
                echo "G10_I_FULL_CANDIDATE_LEAVE_ABSENT_IN_ELF"
                exit 56
              }
              sha256sum "$obj" "${elfs[0]}" >"$EVIDENCE/obj-elf-sha-$label.txt"
              echo "G10_I_FULL_CANDIDATE_SOURCE_MMD_ELF_$label=PASS"
            fi
            echo "G10_I_FULL_${{ matrix.variant }}_$label=PASS"
          done
          echo "G10_I_FULL_ALPHA13_SKETCHES_${{ matrix.variant }}=${#sketches[@]}"
          echo "G10_I_FULL_ALPHA13_PLATFORM_${{ matrix.variant }}=PASS_REPRESENTATIVE_11_NOT_HARDWARE"
      - name: Conservar trazabilidad, sin publicar firmware
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: g10-i-full-${{ matrix.variant }}-${{ github.run_id }}
          path: |
