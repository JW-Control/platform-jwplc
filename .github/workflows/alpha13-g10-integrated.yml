name: Alpha13 G10 - preparacion integrada de fuentes y brechas
on:
  push:
    branches:
      - 'v2.1.0-alpha.13/feature/cleanup-robustness'
    paths:
      - '.github/workflows/alpha13-g10-integrated.yml'
      - 'tools/alpha13/gates/a13_g10_integrated.py'
      - 'tools/alpha13/gates/run_a13_g10_integrated.bat'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  overlay-compose:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python syntax
        shell: pwsh
        run: |
          python -m py_compile tools/alpha13/gates/a13_g10_integrated.py
          python -B tools/alpha13/gates/a13_g10_integrated.py --help
          if ($LASTEXITCODE -ne 0) { throw 'G10_I_SYNTAX' }
      - name: Componer overlays aislados y comprobar freeze
        shell: pwsh
        run: |
          python -B tools/alpha13/gates/a13_g10_integrated.py --ci-standalone | Tee-Object -FilePath g10_i.log
          if ($LASTEXITCODE -ne 0) { throw 'G10_I_PREPARATION_FAIL' }
          $log=Get-Content g10_i.log -Raw
          if ($log -notmatch 'G10_INTEGRATED_SOURCE_OVERLAY=COMPOSED') { throw 'G10_I_NO_OVERLAY' }
          if ($log -notmatch 'G10_INTEGRATED_BLOCKERS=8') { throw 'G10_I_RISK_MASKED' }
          if ($log -notmatch 'G10_INTEGRATED_STATUS=COMPOSED_REVIEW_BLOCKED') { throw 'G10_I_WRONG_STATUS' }
          if ($log -notmatch 'G10_INTEGRATED_PRODUCT_CHANGED=NO') { throw 'G10_I_PRODUCT_CHANGED' }
      - name: No tocar fuentes productivas
        shell: pwsh
        run: |
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'G10_I_TRACKED_DIRTY' }
      - name: Evidencia de preparacion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha13-g10-i-${{ matrix.os }}-${{ github.run_id }}
          path: |
            g10_i.log
            tools/alpha13/results/g10_i_*/
          if-no-files-found: warn
