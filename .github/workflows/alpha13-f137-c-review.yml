name: Alpha13 F137-C - exact package release source (NO merge/upload)

on:
  push:
    branches:
      - codex/alpha13-precompile-benchmark-docs-20261020
    paths:
      - tools/alpha13/f137_c_release_guard.py
      - .github/workflows/alpha13-f137-c-review.yml
      - docs/v2.1.0-alpha.13/ALPHA13_STATUS.md
      - docs/v2.1.0-alpha.13/A13_RELEASE_SOURCE_DECISION_20261020.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-identity:
    name: Package tree N3 + 14-path scope - ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Obtener base Alpha13 para diff read-only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin +refs/heads/v2.1.0-alpha.13/feature/cleanup-robustness:refs/remotes/origin/v2.1.0-alpha.13/feature/cleanup-robustness
      - name: Autoprueba y análisis package exacto (sin compilar ni abrir COM)
        shell: pwsh
        run: |
          python -B -m py_compile tools/alpha13/f137_c_release_guard.py
          python -B tools/alpha13/f137_c_release_guard.py --selftest
          python -B tools/alpha13/f137_c_release_guard.py --review --base-ref origin/v2.1.0-alpha.13/feature/cleanup-robustness --expected-head '${{ github.sha }}' --output (Join-Path $env:RUNNER_TEMP 'F137_C_REVIEW.json')
          python -B tools/alpha13/f137_c_release_guard.py --verify-release-source --expected-head '${{ github.sha }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f137-c-package-identity-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/F137_C_REVIEW.json
          if-no-files-found: warn
          retention-days: 14
