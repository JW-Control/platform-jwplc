name: Alpha13 PRE-H B3 N0 N1 N3 integrados
on:
  pull_request:
    paths:
      - '.github/workflows/alpha13-preh-b3-integrated.yml'
      - 'tools/alpha13/gates/a13_g10_r_b3_*'
      - 'tools/alpha13/gates/a13_g10_r_build_candidate.py'
      - 'tools/alpha13/gates/a13_g10_r_field_runner.py'
      - 'tools/alpha13/gates/a13_g10_r_b2_*'
      - 'tools/alpha13/gates/a13_g10_r_tcp124_*'
      - 'tools/alpha13/sketches/g10_r_integrated/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  n0:
    name: B3 N0 alcance y bloqueos (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Validar baseline y whitelist sin modificar producto
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/alpha13/gates/a13_g10_r_b3_scope.py --selftest
          python -B tools/alpha13/gates/a13_g10_r_b3_scope.py --check
          git diff --quiet a954cabd9c6e37876b59995a41ff0a449308ccd1 HEAD -- JWPLC/
          echo B3_N3_BASELINE_REUSE=G10I_11_OF_11_RUN_38843599043
      - name: Preflight y runner sin hardware
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/alpha13/gates/a13_g10_r_preflight.py --selftest
          python -B tools/alpha13/gates/a13_g10_r_build_candidate.py --selftest
          python -B tools/alpha13/gates/a13_g10_r_field_runner.py --selftest
          python -B tools/alpha13/gates/a13_g10_r_field_runner.py --dry-run
          echo B3_N0=PASS_NO_USB_NO_UPLOAD
  n1:
    name: B3 N1 código nativo y negativos
    runs-on: ubuntu-24.04
    needs: n0
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Pruebas nativas sin hardware
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/alpha13/gates/a13_g10_r_trace.py --source-check
          python -B tools/alpha13/gates/a13_g10_r_r3_native.py --native
          python -B tools/alpha13/gates/a13_g10_r_r3_protocol_native.py --native
          python -B tools/alpha13/gates/a13_g10_r_r3_probe_contract.py --selftest
          python -B tools/alpha13/gates/a13_g10_r_tcp124_join.py --selftest
          python -B tools/alpha13/gates/a13_g10_r_tcp124_collector.py --selftest
          python -B tools/alpha13/gates/a13_g10_r_b2_contract.py --selftest
          echo B3_N1=PASS_NATIVE_SOURCE_BACKED_NONPHYSICAL
  n3-candidate:
    name: B3 N3 paquete candidato 11 sketches
    runs-on: ubuntu-24.04
    needs: [n0, n1]
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.5.1'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15/packages/jwplc
            ~/.arduino15/staging
          key: b3-alpha13-immutable-alpha10-${{ runner.os }}-${{ hashFiles('JWPLC/package_jwplc_index_dev.json') }}
      - name: Preparar Arduino CLI aislado
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls "https://raw.githubusercontent.com/JW-Control/platform-jwplc/main/JWPLC/package_jwplc_index_dev.json"
          arduino-cli core update-index
          arduino-cli core install 'jwplc:esp32@2.1.0-alpha.10'
      - name: Compilar 11 sketches staged y verificar fuente objeto ELF
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/alpha13/gates/a13_g10_r_b3_matrix.py --selftest
          python -B tools/alpha13/gates/a13_g10_r_b3_matrix.py --run --output "$RUNNER_TEMP/b3-n3"
      - name: Adjuntar logs y hashes, sin publicar firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha13-b3-n3-${{ github.run_id }}
          path: ${{ runner.temp }}/b3-n3/
          if-no-files-found: warn
          retention-days: 14
