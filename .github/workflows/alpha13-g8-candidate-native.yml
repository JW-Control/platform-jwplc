name: Alpha13 G8 - C++ native RTU and RS485

on:
  push:
    branches:
      - 'v2.1.0-alpha.13/feature/cleanup-robustness'
    paths:
      - '.github/workflows/alpha13-g8-candidate-native.yml'
      - 'tools/alpha13/gates/a13_g8_source_selftest.py'
      - 'tools/alpha13/gates/a13_g8_p1_p2_candidate.py'
      - 'tools/alpha13/gates/a13_g8_adopt_local.py'
      - 'tools/alpha13/gates/run_a13_g8_adopt.bat'
      - 'JWPLC/2.1.0/libraries/JWPLC_ModbusRTU/src/JWPLC_ModbusRTU.cpp'
      - 'JWPLC/2.1.0/libraries/JWPLC_RS485/src/JWPLC_RS485.cpp'
      - 'tools/alpha13/gates/run_a13_g8_p1_p2_candidate.bat'
      - 'tools/alpha13/candidates/g8/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-rtu-rs485:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4
      - name: Sintaxis y delta canónico
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/alpha13/gates/a13_g8_source_selftest.py
          python3 -m py_compile tools/alpha13/gates/a13_g8_p1_p2_candidate.py
          python3 -m py_compile tools/alpha13/gates/a13_g8_adopt_local.py
          python3 -B tools/alpha13/gates/a13_g8_adopt_local.py --help
          python3 -B tools/alpha13/gates/a13_g8_p1_p2_candidate.py --help
          python3 -B tools/alpha13/gates/a13_g8_source_selftest.py --native-cxx "$(command -v g++)" --require-native | tee g8_native.log
          grep -qx 'G8_SOURCE_CONTRACT=PASS' g8_native.log
          grep -qx 'G8_HARDWARESERIAL_BOOL_CORE_CONTRACT=PASS' g8_native.log
          grep -qx 'G8_NATIVE_TOTAL_CASES=20' g8_native.log
          grep -qx 'G8_NATIVE_CPP=PASS_ACTUAL_EXTRACTED_BRANCHES' g8_native.log
      - name: Simular la adopcion de ambas fuentes en CI
        shell: bash
        run: |
          set -euo pipefail
          cp tools/alpha13/candidates/g8/JWPLC_ModbusRTU.cpp JWPLC/2.1.0/libraries/JWPLC_ModbusRTU/src/JWPLC_ModbusRTU.cpp
          cp tools/alpha13/candidates/g8/JWPLC_RS485.cpp JWPLC/2.1.0/libraries/JWPLC_RS485/src/JWPLC_RS485.cpp
          python3 -B tools/alpha13/gates/a13_g8_source_selftest.py --native-cxx "$(command -v g++)" --require-native | tee g8_native_adopted.log
          grep -qx 'G8_SOURCE_STATE=ADOPTED_EXACT_CANDIDATE' g8_native_adopted.log
          grep -qx 'G8_NATIVE_TOTAL_CASES=20' g8_native_adopted.log
          grep -qx 'G8_NATIVE_CPP=PASS_ACTUAL_EXTRACTED_BRANCHES' g8_native_adopted.log
      - name: Probar alcance Git de las tres rutas productivas en checkout efimero
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util, pathlib, tempfile
          p=pathlib.Path("tools/alpha13/gates/a13_g8_adopt_local.py")
          spec=importlib.util.spec_from_file_location("g8_adopt_selftest",p)
          gate=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(gate)
          engine=gate.engine()
          # Luego del commit de producto, ambas fuentes ya son iguales
          # a los candidatos: forzar cambios SOLO en el checkout de CI
          # para probar el mismo contrato de tres rutas, sin mutar el repo remoto.
          for source in [
              engine.RTU/"src/JWPLC_ModbusRTU.cpp",
              engine.RS/"src/JWPLC_RS485.cpp",
          ]:
              with source.open("ab") as f:
                  f.write(b"\n// G8_CI_GIT_SCOPE_EPHEMERAL_ONLY\n")
          with (engine.ARCHIVE).open("ab") as f:
              f.write(b"G8_CI_GIT_SCOPE_EPHEMERAL_ONLY")
          with tempfile.TemporaryDirectory() as tmp:
              engine.RES=pathlib.Path(tmp)
              engine.M={"run_id":"ci_scope","status":"CI","phases":{}}
              assert gate.audit_git_scope(engine,{
                  engine.RTU/"src/JWPLC_ModbusRTU.cpp":engine.CAND_RTU,
                  engine.RS/"src/JWPLC_RS485.cpp":engine.CAND_RS,
                  engine.ARCHIVE:engine.ARCHIVE,
              },"CI")
          print("G8_CI_GIT_DIFF_EXACT_THREE=PASS")
          PY
      - name: Guardar evidencia incluso ante fallo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha13-g8-native-${{ github.run_id }}
          path: |
            g8_native.log
            g8_native_adopted.log
          if-no-files-found: warn
