name: Alpha13 G8 - Git index diagnostic read-only

on:
  push:
    branches:
      - 'v2.1.0-alpha.13/feature/cleanup-robustness'
    paths:
      - '.github/workflows/alpha13-g8-git-index-readonly.yml'
      - 'tools/alpha13/gates/a13_g8_git_index_diagnostic.py'
      - 'tools/alpha13/gates/a13_g8_index_contract_selftest.py'
      - 'tools/alpha13/gates/a13_g8_adopt_local.py'
      - 'tools/alpha13/gates/run_a13_g8_git_index_diagnostic.bat'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  index-readonly:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Sintaxis del diagnóstico
        run: python -m py_compile tools/alpha13/gates/a13_g8_git_index_diagnostic.py
      - name: Inspeccionar Git sin alterar los tres archivos
        run: python -B tools/alpha13/gates/a13_g8_git_index_diagnostic.py
      - name: Verificar reconocimiento de las tres rutas
        shell: pwsh
        run: |
          $manifest = Get-ChildItem tools/alpha13/results/g8_d0_*/MANIFEST.json | Select-Object -First 1
          if (-not $manifest) { throw "DIAG_MANIFEST_MISSING" }
          $m = Get-Content $manifest.FullName -Raw | ConvertFrom-Json
          if ($m.status -ne 'DIAGNOSTIC_COLLECTED_NO_MUTATION') { throw "DIAG_INCOMPLETE" }
          if (-not $m.all_expected_index) { throw "INDEX_PATHS_UNRECOGNIZED" }
          if (-not $m.all_expected_head) { throw "HEAD_PATHS_UNRECOGNIZED" }
          if (-not $m.clean) { throw "GIT_DIRTY" }
          Write-Host "G8_D0_CI_GIT_INDEX=PASS"
      - name: Probar helper real de adopcion con tres cambios en checkout efimero
        run: |
          python -m py_compile tools/alpha13/gates/a13_g8_index_contract_selftest.py tools/alpha13/gates/a13_g8_adopt_local.py
          python -B tools/alpha13/gates/a13_g8_index_contract_selftest.py
      - name: Guardar diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha13-g8-git-index-${{ matrix.os }}-${{ github.run_id }}
          path: tools/alpha13/results/g8_d0_*/
          if-no-files-found: warn
