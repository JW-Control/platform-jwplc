name: Alpha13 F137 H dual COM14+COM4 - sealed builds (NO upload)
on:
  push:
    branches:
      - codex/alpha13-precompile-benchmark-docs-20261020
    paths:
      - tools/alpha13/h_f137_dual.py
      - tools/alpha13/g10_promoted_bench/G10P_COM14_Slave/**
      - .github/workflows/alpha13-f137-h-dual-build.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dual-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.5.1'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15/packages/jwplc
            ~/.arduino15/staging
          key: a13-f137-dual-${{ runner.os }}-${{ hashFiles('JWPLC/package_jwplc_index_dev.json') }}
      - name: Arduino CLI toolchain original N3
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls "https://raw.githubusercontent.com/JW-Control/platform-jwplc/main/JWPLC/package_jwplc_index_dev.json"
          arduino-cli core update-index
          arduino-cli core install 'jwplc:esp32@2.1.0-alpha.10'
      - name: N0 negativo e identidad de sketches (NO USB)
        shell: pwsh
        run: |
          python -B -m py_compile tools/alpha13/h_f137_dual.py
          python -B tools/alpha13/h_f137_dual.py --selftest
          python -B tools/alpha13/h_f137_com4_build.py --selftest
          python -B tools/alpha13/h_f137_com4.py --selftest
          python -B tools/alpha13/h_f137_dual.py --upload-both --ci-detached --expected-head '${{ github.sha }}' 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'F137_UPLOAD_IN_CI_FALSE_PASS' }
      - name: Build Master una vez desde package, no puertos
        shell: pwsh
        run: |
          python -B tools/alpha13/h_f137_com4_build.py --prepare --ci-detached --expected-head '${{ github.sha }}' --output (Join-Path $env:RUNNER_TEMP 'f137-dual')
      - name: Build Slave usando el stage y sellado Master
        shell: pwsh
        run: |
          python -B tools/alpha13/h_f137_dual.py --prepare-slave --ci-detached --expected-head '${{ github.sha }}' --output (Join-Path $env:RUNNER_TEMP 'f137-dual')
      - name: Artifacts solo manifiestos/logs, jamas upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha13-f137-h-dual-${{ matrix.os }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/f137-dual/MANIFEST.json
            ${{ runner.temp }}/f137-dual/MANIFEST_COM14.json
            ${{ runner.temp }}/f137-dual/compile_COM4_MASTER.log
            ${{ runner.temp }}/f137-dual/compile_COM14_SLAVE.log
          retention-days: 14
          if-no-files-found: warn
