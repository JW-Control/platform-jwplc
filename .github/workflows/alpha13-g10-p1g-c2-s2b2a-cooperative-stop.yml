name: Alpha13 G10 P1G-C2-S2B2A - cooperative TCP stop
on:
  push:
    branches:
      - 'v2.1.0-alpha.13/feature/cleanup-robustness'
    paths:
      - '.github/workflows/alpha13-g10-p1g-c2-s2b2a-cooperative-stop.yml'
      - 'tools/alpha13/gates/a13_g10_p1g_c2_s2b2a_cooperative_stop.py'
      - 'tools/alpha13/gates/run_a13_g10_p1g_c2_s2b2a_cooperative_stop.bat'
      - 'tools/alpha13/candidates/g10_p1g_c/native_c2_s2b2a_cooperative_stop_test.cpp'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpp-source-stop:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax and help
        shell: pwsh
        run: |
          python -m py_compile tools/alpha13/gates/a13_g10_p1g_c2_s2b2a_cooperative_stop.py
          python -B tools/alpha13/gates/a13_g10_p1g_c2_s2b2a_cooperative_stop.py --help
          if ($LASTEXITCODE -ne 0) { throw 'C2_S2B2A_SYNTAX_FAILED' }
      - name: Host C++ 3 real cooperative methods plus 4 negative mutations
        shell: pwsh
        run: |
          python -B tools/alpha13/gates/a13_g10_p1g_c2_s2b2a_cooperative_stop.py --ci-standalone | Tee-Object -FilePath c2_s2b2a.log
          if ($LASTEXITCODE -ne 0) { throw 'C2_S2B2A_NATIVE_FAILED' }
          $s = Get-Content c2_s2b2a.log -Raw
          if ($s -notmatch 'G10_P1G_C2_S2B2A_POSITIVE_NATIVE=PASS_REAL_COOPERATIVE_STOP_METHODS') { throw 'POSITIVE_MISSING' }
          if ($s -notmatch 'G10_P1G_C2_S2B2A_NEGATIVES=4') { throw 'NEGATIVES_MISSING' }
          if ($s -notmatch 'G10_P1G_C2_S2B2A_STATUS=COOPERATIVE_STOP_REAL_METHODS_PASS_INCOMPLETE_ADOPTION_BLOCKED') { throw 'WRONG_STATUS' }
      - name: Product files untouched
        shell: pwsh
        run: |
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'TRACKED_PRODUCT_CHANGED' }
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha13-c2-s2b2a-${{ matrix.os }}-${{ github.run_id }}
          path: |
            c2_s2b2a.log
            tools/alpha13/results/g10_p1g_c2_s2b2a_*/
          if-no-files-found: warn
