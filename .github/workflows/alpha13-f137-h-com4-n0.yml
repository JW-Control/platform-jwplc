name: Alpha13 F137 - H COM4 N0 sin USB ni upload

on:
  push:
    branches:
      - codex/alpha13-precompile-benchmark-docs-20261020
    paths:
      - tools/alpha13/h_f137_com4.py
      - .github/workflows/alpha13-f137-h-com4-n0.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Selftest sin hardware
        run: |
          python -B -m py_compile tools/alpha13/h_f137_com4.py
          python -B tools/alpha13/h_f137_com4.py --selftest

  windows:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Selftest sin hardware
        shell: pwsh
        run: |
          python -B -m py_compile tools/alpha13/h_f137_com4.py
          python -B tools/alpha13/h_f137_com4.py --selftest
