name: Release JWPLC Arduino Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión sin v inicial. Ejemplo: 2.1.0-alpha.10, 2.1.0-beta.1, 2.1.0"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Preparar y publicar package JWPLC
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolver política fija de publicación
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z]+\.[0-9]+)?$ ]]; then
            echo "Versión inválida: ${{ inputs.version }}"
            echo "Ejemplos válidos: 2.1.0-alpha.10, 2.1.0-beta.1, 2.1.0"
            exit 1
          fi

          BASE_VERSION="${VERSION%%-*}"
          SOURCE_FOLDER="JWPLC/$BASE_VERSION"
          NOTES_FILE="docs/v${VERSION}/PRE_RELEASE.md"
          TAG="v$VERSION"
          ARCHIVE="jwplc-esp32-$VERSION.zip"
          INDEX_BRANCH="ci/release-index-v$VERSION"

          if [[ ! -d "$SOURCE_FOLDER" ]]; then
            echo "No existe source folder: $SOURCE_FOLDER"
            exit 1
          fi

          if [[ ! -f "$SOURCE_FOLDER/boards.txt" ]] || [[ ! -f "$SOURCE_FOLDER/platform.txt" ]]; then
            echo "El source folder no parece una plataforma Arduino válida: $SOURCE_FOLDER"
            echo "Se requieren boards.txt y platform.txt."
            exit 1
          fi

          if [[ ! -f "$NOTES_FILE" ]]; then
            echo "Falta documentación de PreRelease: $NOTES_FILE"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BASE_VERSION=$BASE_VERSION" >> "$GITHUB_ENV"
          echo "SOURCE_FOLDER=$SOURCE_FOLDER" >> "$GITHUB_ENV"
          echo "NOTES_FILE=$NOTES_FILE" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
          echo "INDEX_BRANCH=$INDEX_BRANCH" >> "$GITHUB_ENV"

          echo "========================================"
          echo " JWPLC RELEASE POLICY"
          echo "========================================"
          echo "VERSION=$VERSION"
          echo "SOURCE_FOLDER=$SOURCE_FOLDER"
          echo "ARCHIVE_ROOT_MODE=folder"
          echo "RECREATE_ZIP=true"
          echo "CHANNEL=auto"
          echo "UPDATE_PUBLIC_INDEX=auto"
          echo "REPLACE_EXISTING_INDEX_ENTRY=true"
          echo "INDEX_PR_BASE=main"
          echo "PUBLISH_RELEASE=true"
          echo "FAIL_IF_RELEASE_EXISTS=true"

      - name: Rechazar release/tag existente
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "La release $TAG ya existe."
            echo "Para conservar inmutabilidad, el workflow normal no la sobrescribe."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "El tag remoto $TAG ya existe aunque no exista GitHub Release."
            echo "Resolver manualmente antes de publicar."
            exit 1
          fi

          echo "RELEASE_TAG_AVAILABLE=PASS"

      - name: Seed package indexes from main
        shell: bash
        run: |
          set -euo pipefail

          # main conserva el histórico canónico del Boards Manager.
          # La rama release contiene el código exacto que se publicará.
          git fetch origin main --depth=1
          git show origin/main:JWPLC/package_jwplc_index_dev.json > JWPLC/package_jwplc_index_dev.json
          git show origin/main:JWPLC/package_jwplc_index.json > JWPLC/package_jwplc_index.json

      - name: Preparar ZIP e índices
        id: prepare
        shell: bash
        run: |
          set -euo pipefail

          python JWPLC/tools/jwplc_release.py prepare \
            --version "$VERSION" \
            --channel auto \
            --source-folder "$SOURCE_FOLDER" \
            --recreate-zip \
            --archive-root-mode folder \
            --repo-full-name "$GITHUB_REPOSITORY" \
            --update-public-index auto \
            --replace-existing-index-entry \
            --release-title "$TAG - JWPLC Arduino package"

      - name: Validar estructura instalable del ZIP
        shell: bash
        env:
          ZIP_FILE: ${{ steps.prepare.outputs.zip_file }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          import sys
          import zipfile

          zip_file = os.environ["ZIP_FILE"]
          expected_root = os.environ["BASE_VERSION"]

          with zipfile.ZipFile(zip_file, "r") as zf:
              names = [name for name in zf.namelist() if name and not name.endswith("/")]

          if not names:
              print("ZIP vacío")
              sys.exit(1)

          roots = sorted({name.split("/", 1)[0] for name in names})
          print(f"ZIP_ROOTS={roots}")

          if roots != [expected_root]:
              print(f"ERROR: se esperaba una única raíz '{expected_root}'")
              sys.exit(1)

          required = {
              f"{expected_root}/boards.txt",
              f"{expected_root}/platform.txt",
          }
          missing = sorted(required.difference(names))
          if missing:
              print(f"ERROR: faltan archivos requeridos: {missing}")
              sys.exit(1)

          print("JWPLC_PACKAGE_UNIQUE_ROOT=PASS")
          print("JWPLC_PACKAGE_REQUIRED_FILES=PASS")
          PY

      - name: Mostrar metadata generada
        shell: bash
        run: |
          echo "Version     : ${{ steps.prepare.outputs.version }}"
          echo "Tag         : ${{ steps.prepare.outputs.tag }}"
          echo "Channel     : ${{ steps.prepare.outputs.channel }}"
          echo "ZIP file    : ${{ steps.prepare.outputs.zip_file }}"
          echo "ZIP name    : ${{ steps.prepare.outputs.zip_name }}"
          echo "Checksum    : ${{ steps.prepare.outputs.checksum }}"
          echo "Size        : ${{ steps.prepare.outputs.size }}"
          echo "Prerelease  : ${{ steps.prepare.outputs.prerelease }}"
          echo "Public index: ${{ steps.prepare.outputs.update_public }}"

      - name: Validar package indexes como JSON
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool JWPLC/package_jwplc_index_dev.json >/dev/null
          python -m json.tool JWPLC/package_jwplc_index.json >/dev/null
          echo "PACKAGE_INDEX_JSON_VALIDATION=PASS"

      - name: Commit package index en rama automática
        id: index_commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          INDEX_TMP="$RUNNER_TEMP/jwplc-release-index-$VERSION"
          INDEX_WORKTREE="$RUNNER_TEMP/jwplc-index-worktree-$VERSION"
          BASE_BRANCH="main"

          rm -rf "$INDEX_TMP" "$INDEX_WORKTREE"
          mkdir -p "$INDEX_TMP"

          cp JWPLC/package_jwplc_index_dev.json "$INDEX_TMP/package_jwplc_index_dev.json"
          cp JWPLC/package_jwplc_index.json "$INDEX_TMP/package_jwplc_index.json"

          git fetch origin "$BASE_BRANCH" --depth=1
          git worktree add --detach "$INDEX_WORKTREE" "origin/$BASE_BRANCH"
          git -C "$INDEX_WORKTREE" checkout -B "$INDEX_BRANCH"

          cp "$INDEX_TMP/package_jwplc_index_dev.json" "$INDEX_WORKTREE/JWPLC/package_jwplc_index_dev.json"
          cp "$INDEX_TMP/package_jwplc_index.json" "$INDEX_WORKTREE/JWPLC/package_jwplc_index.json"

          # Mantener el README visible de main alineado con la release publicada.
          git show "$GITHUB_SHA:README.md" > "$INDEX_WORKTREE/README.md"

          git -C "$INDEX_WORKTREE" add \
            README.md \
            JWPLC/package_jwplc_index_dev.json \
            JWPLC/package_jwplc_index.json

          if git -C "$INDEX_WORKTREE" diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No hay cambios de índice/README para commit."
            git worktree remove --force "$INDEX_WORKTREE"
            exit 0
          fi

          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          git -C "$INDEX_WORKTREE" commit -m "ci(release): update JWPLC package indexes for $TAG"
          git -C "$INDEX_WORKTREE" push --force-with-lease origin "$INDEX_BRANCH"
          git worktree remove --force "$INDEX_WORKTREE"

      - name: Abrir o actualizar PR de package index
        if: ${{ steps.index_commit.outputs.has_changes == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          BASE_BRANCH="main"
          PR_TITLE="ci(release): update JWPLC package indexes for $TAG"
          PR_BODY=$(cat <<EOF
          ## Resumen

          Actualiza los package index de JWPLC para $TAG.

          ## Metadatos generados

          - Versión: ${{ steps.prepare.outputs.version }}
          - Canal: ${{ steps.prepare.outputs.channel }}
          - ZIP: ${{ steps.prepare.outputs.zip_name }}
          - Checksum: ${{ steps.prepare.outputs.checksum }}
          - Size: ${{ steps.prepare.outputs.size }} bytes
          - Actualiza índice público: ${{ steps.prepare.outputs.update_public }}
          - Archive root: $BASE_VERSION/

          ## Política fija

          - ZIP regenerado desde el source del branch de release.
          - Una única carpeta raíz obligatoria.
          - Índice dev actualizado siempre.
          - Índice estable actualizado sólo para canal estable.
          - PR hacia main obligatorio cuando existen cambios.

          PR generado automáticamente por GitHub Actions.
          EOF
          )

          EXISTING_PR=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$INDEX_BRANCH" \
            --base "$BASE_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [[ -n "$EXISTING_PR" ]]; then
            echo "Actualizando PR existente #$EXISTING_PR"
            gh pr edit "$EXISTING_PR" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$PR_TITLE" \
              --body "$PR_BODY"
          else
            echo "Creando PR desde $INDEX_BRANCH hacia $BASE_BRANCH"
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base "$BASE_BRANCH" \
              --head "$INDEX_BRANCH" \
              --title "$PR_TITLE" \
              --body "$PR_BODY"
          fi

      - name: Crear GitHub Release / PreRelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          ZIP_FILE="${{ steps.prepare.outputs.zip_file }}"
          PRERELEASE_FLAG=""

          if [[ "${{ steps.prepare.outputs.prerelease }}" == "true" ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "$TAG" "$ZIP_FILE" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "${{ steps.prepare.outputs.release_title }}" \
            --notes-file "$NOTES_FILE" \
            $PRERELEASE_FLAG

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: jwplc-package-${{ steps.prepare.outputs.version }}
          path: |
            ${{ steps.prepare.outputs.zip_file }}
            JWPLC/package_jwplc_index_dev.json
            JWPLC/package_jwplc_index.json
          if-no-files-found: error
