name: Alpha11 audit JWPLC examples

on:
  push:
    branches:
      - v2.1.0-alpha.11/feature/hmi-designer
    paths:
      - ".github/workflows/alpha11-audit-jwplc-examples.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auditar includes y API Display
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('JWPLC/2.1.0/libraries')
          exts = {'.ino', '.h', '.hpp', '.c', '.cpp'}
          files = []
          for lib in sorted(root.iterdir()):
              if not lib.is_dir() or not lib.name.startswith('JW'):
                  continue
              ex = lib / 'examples'
              if not ex.exists():
                  continue
              for p in sorted(ex.rglob('*')):
                  if p.is_file() and p.suffix.lower() in exts:
                      files.append(p)

          integrated = {
              'JWPLC_Display', 'JWPLC_Ethernet', 'JWPLC_GlobalPeripherals',
              'JWPLC_RS485', 'JWPLC_ModbusRTU'
          }
          autoload_headers = {
              'JWPLC_GlobalPeripherals.h', 'JW_RTC.h', 'JW_FRAM.h', 'JW_SD.h',
              'JW_MatrixButtons.h', 'JWPLC_Ethernet.h', 'JWPLC_RS485.h',
              'JWPLC_ModbusRTU.h', 'JWPLC_GlobalPeripherals_RuntimeView.h',
              'jwplc_spi_bus.h'
          }
          actual_legacy = [
              r'jwplcUserDisplayEnterCallback',
              r'jwplcUserDisplayRefreshNeededCallback',
              r'jwplcUserDisplayRefreshCallback',
              r'jwplcUserDisplayExitCallback',
          ]
          modern_callback = [
              r'jwplcUIEnter\s*\(', r'jwplcUIPageEnter\s*\(',
              r'jwplcUIUpdate\s*\(', r'jwplcUIExit\s*\('
          ]

          print(f'AUDIT_FILES={len(files)}')
          print('=== INTEGRATED EXAMPLE INCLUDES ===')
          for p in files:
              parts = p.parts
              try:
                  lib = parts[parts.index('libraries') + 1]
              except (ValueError, IndexError):
                  continue
              if lib not in integrated:
                  continue
              text = p.read_text(encoding='utf-8', errors='replace')
              includes = re.findall(r'^\s*#\s*include\s*[<\"]([^>\"]+)[>\"]', text, re.M)
              if includes:
                  print(p.as_posix())
                  print('  INCLUDES=' + ','.join(includes))

          print('\n=== AUTOLOAD REDUNDANCY CANDIDATES ===')
          redundancy_files = 0
          for p in files:
              parts = p.parts
              try:
                  lib = parts[parts.index('libraries') + 1]
              except (ValueError, IndexError):
                  continue
              if lib not in integrated:
                  continue
              text = p.read_text(encoding='utf-8', errors='replace')
              includes = re.findall(r'^\s*#\s*include\s*[<\"]([^>\"]+)[>\"]', text, re.M)
              candidates = [h for h in includes if h in autoload_headers]
              if candidates:
                  redundancy_files += 1
                  print(p.as_posix())
                  print('  AUTOLOAD=' + ','.join(candidates))

          print('\n=== DISPLAY API ===')
          legacy_files = 0
          modern_files = 0
          for p in files:
              text = p.read_text(encoding='utf-8', errors='replace')
              legacy = [pat for pat in actual_legacy if re.search(pat, text)]
              modern = [pat for pat in modern_callback if re.search(pat, text)]
              if legacy:
                  legacy_files += 1
                  print('LEGACY ' + p.as_posix() + ' :: ' + ','.join(legacy))
              if modern:
                  modern_files += 1
                  print('MODERN_CALLBACK ' + p.as_posix() + ' :: ' + ','.join(modern))

          print(f'AUTOLOAD_REDUNDANCY_FILES={redundancy_files}')
          print(f'LEGACY_DISPLAY_FILES={legacy_files}')
          print(f'MODERN_CALLBACK_FILES={modern_files}')
          print('ALPHA11_JWPLC_EXAMPLES_AUDIT=PASS')
          PY
