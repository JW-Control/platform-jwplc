name: Alpha13 G10-R R1-R4 build y replay sin hardware

on:
  push:
    branches: ['codex/alpha13-g10-r-*']
    paths:
      - '.github/workflows/alpha13-g10-r-source-build.yml'
      - 'tools/alpha13/gates/a13_g10_r_build_candidate.py'
      - 'tools/alpha13/gates/a13_g10_r_h0_link_stage.py'
      - 'tools/alpha13/gates/a13_g10_r_replay.py'
      - 'tools/alpha13/gates/a13_g10_r_instrumentation.py'
      - 'tools/alpha13/gates/a13_g10_r_owner_epoch.py'
      - 'tools/alpha13/gates/a13_g10_r_field_runner.py'
      - 'tools/alpha13/gates/a13_g10_r_r3_native.py'
      - 'tools/alpha13/gates/a13_g10_r_trace.py'
      - 'tools/alpha13/gates/a13_g10_r_trace_host.py'
      - 'tools/alpha13/gates/a13_g10_r_trace_validate.py'
      - 'tools/alpha13/gates/a13_g10_r_r3_protocol_native.py'
      - 'tools/alpha13/gates/a13_g10_r_r3_probe_contract.py'
      - 'tools/alpha13/candidates/g10_r/native_g10_r_lab_snapshot_test.cpp'
      - 'tools/alpha13/sketches/g10_r_integrated/**'
  pull_request:
    paths:
      - '.github/workflows/alpha13-g10-r-source-build.yml'
      - 'tools/alpha13/gates/a13_g10_r_build_candidate.py'
      - 'tools/alpha13/gates/a13_g10_r_h0_link_stage.py'
      - 'tools/alpha13/gates/a13_g10_r_replay.py'
      - 'tools/alpha13/gates/a13_g10_r_instrumentation.py'
      - 'tools/alpha13/gates/a13_g10_r_owner_epoch.py'
      - 'tools/alpha13/gates/a13_g10_r_field_runner.py'
      - 'tools/alpha13/gates/a13_g10_r_r3_native.py'
      - 'tools/alpha13/gates/a13_g10_r_trace.py'
      - 'tools/alpha13/gates/a13_g10_r_trace_host.py'
      - 'tools/alpha13/gates/a13_g10_r_trace_validate.py'
      - 'tools/alpha13/gates/a13_g10_r_r3_protocol_native.py'
      - 'tools/alpha13/gates/a13_g10_r_r3_probe_contract.py'
      - 'tools/alpha13/candidates/g10_r/native_g10_r_lab_snapshot_test.cpp'
      - 'tools/alpha13/sketches/g10_r_integrated/**'

permissions:
  contents: read

jobs:
  offline-contracts:
    name: G10-R offline replay y negativos (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Contrato de alcance G10-R, producto congelado
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/alpha13/gates/a13_g10_r_b3_scope.py --selftest
          python -B tools/alpha13/gates/a13_g10_r_b3_scope.py --check
          echo "G10_R_PREH_SCOPE_LEGACY_AND_NEW=PASS_STRICT"
      - name: Compilar parser Python y validar negativos
        shell: bash
        run: |
          set -euo pipefail
          python -B -m py_compile tools/alpha13/gates/a13_g10_r_replay.py tools/alpha13/gates/a13_g10_r_build_candidate.py tools/alpha13/gates/a13_g10_r_instrumentation.py tools/alpha13/gates/a13_g10_r_owner_epoch.py tools/alpha13/gates/a13_g10_r_field_runner.py tools/alpha13/gates/a13_g10_r_r3_native.py tools/alpha13/gates/a13_g10_r_trace.py tools/alpha13/gates/a13_g10_r_trace_host.py tools/alpha13/gates/a13_g10_r_trace_validate.py tools/alpha13/gates/a13_g10_r_r3_protocol_native.py tools/alpha13/gates/a13_g10_r_r3_probe_contract.py
          python -B tools/alpha13/gates/a13_g10_r_replay.py --selftest
          python -B tools/alpha13/gates/a13_g10_r_build_candidate.py --selftest
          python -B tools/alpha13/gates/a13_g10_r_h0_link_stage.py --selftest
          python -B tools/alpha13/gates/a13_g10_r_instrumentation.py --selftest
          python -B tools/alpha13/gates/a13_g10_r_owner_epoch.py --selftest
          python -B tools/alpha13/gates/a13_g10_r_field_runner.py --selftest
          python -B tools/alpha13/gates/a13_g10_r_trace_host.py --selftest
          python -B tools/alpha13/gates/a13_g10_r_trace_validate.py --selftest
          python -B tools/alpha13/gates/a13_g10_r_r3_native.py --selftest
          python -B tools/alpha13/gates/a13_g10_r_r3_protocol_native.py --selftest
          python -B tools/alpha13/gates/a13_g10_r_r3_probe_contract.py --selftest
          python -B tools/alpha13/gates/a13_g10_r_trace.py --selftest
          python -B tools/alpha13/gates/a13_g10_r_trace.py --source-check
          python -B tools/alpha13/gates/a13_g10_r_field_runner.py --dry-run
          echo "G10_R_OFFLINE_CONTRACTS=PASS_SYNTHETIC_NO_HARDWARE"

  candidate-build:
    name: G10-R source first COM4 COM14 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.5.1'
      - name: Instalar toolchain bootstrap exclusivo de CI
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls "https://raw.githubusercontent.com/JW-Control/platform-jwplc/main/JWPLC/package_jwplc_index_dev.json"
          arduino-cli core update-index
          arduino-cli core install "jwplc:esp32@2.1.0-alpha.10"
          echo "G10_R_CORE_BOOTSTRAP=PASS"
      - name: Compilar fuente candidata aislada sin COM ni upload
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/alpha13/gates/a13_g10_r_build_candidate.py --build
          echo "G10_R_COM4_COM14_COMPILATION=PASS_NO_USB_NO_UPLOAD"

  native-r3-lab:
    name: G10-R R3 source-backed C++ mutex snapshots (Ubuntu host)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verificar fuente real y exclusión de hardware
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/alpha13/gates/a13_g10_r_r3_native.py --selftest
          python -B tools/alpha13/gates/a13_g10_r_r3_protocol_native.py --selftest
          python -B tools/alpha13/gates/a13_g10_r_r3_probe_contract.py --selftest
          python -B tools/alpha13/gates/a13_g10_r_trace.py --selftest
          python -B tools/alpha13/gates/a13_g10_r_trace.py --source-check
          python -B tools/alpha13/gates/a13_g10_r_r3_native.py --native
          python -B tools/alpha13/gates/a13_g10_r_r3_protocol_native.py --native
          echo "G10_R_R3_HOST_CPP=PASS_REAL_SOURCE_NONPHYSICAL"
