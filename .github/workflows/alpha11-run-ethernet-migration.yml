name: Alpha11 run Ethernet TFT migration

on:
  push:
    branches:
      - v2.1.0-alpha.11/feature/hmi-designer
    paths:
      - ".github/workflows/alpha11-run-ethernet-migration.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extraer y ejecutar migración
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/alpha11-modernize-ethernet-tft.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          block = source[start:end]

          lines = []
          for line in block.splitlines():
              if line.startswith('          '):
                  line = line[10:]
              lines.append(line)

          script = '\n'.join(lines) + '\n'
          compile(script, '/tmp/alpha11-ethernet-migrate.py', 'exec')
          Path('/tmp/alpha11-ethernet-migrate.py').write_text(script, encoding='utf-8')
          print('MIGRATION_SCRIPT_EXTRACTED=PASS')
          PY

          python3 /tmp/alpha11-ethernet-migrate.py
          git diff --check
          git diff --stat

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "JW-Control Actions"
          git config user.email "jw.control.peru@gmail.com"
          git add \
            JWPLC/2.1.0/libraries/JWPLC_Ethernet/examples/Ethernet_SPI_Coexistence/Ethernet_SPI_Coexistence.ino \
            JWPLC/2.1.0/libraries/JWPLC_Ethernet/examples/Ethernet_HTTP_TFT_Diagnostics/Ethernet_HTTP_TFT_Diagnostics.ino \
            JWPLC/2.1.0/libraries/JWPLC_Ethernet/examples/Ethernet_Continuous_Stress_TFT/Ethernet_Continuous_Stress_TFT.ino \
            JWPLC/2.1.0/libraries/JWPLC_Ethernet/src/JWPLC_Ethernet_DNS.h
          git commit -m "refactor(alpha11): usar fields declarativos en TFT Ethernet"
          git push origin HEAD:v2.1.0-alpha.11/feature/hmi-designer
