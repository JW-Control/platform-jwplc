name: Alpha13 G10 P1G-C1 - W5500 bus lease prototype

on:
  push:
    branches:
      - 'v2.1.0-alpha.13/feature/cleanup-robustness'
    paths:
      - '.github/workflows/alpha13-g10-p1g-c1-native-prototype.yml'
      - 'tools/alpha13/candidates/g10_p1g_c/**'
      - 'tools/alpha13/gates/a13_g10_p1g_c1_native_prototype.py'
      - 'tools/alpha13/gates/run_a13_g10_p1g_c1_native_prototype.bat'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-native-bus-lease:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python syntax
        shell: pwsh
        run: |
          python -m py_compile tools/alpha13/gates/a13_g10_p1g_c1_native_prototype.py
          python -B tools/alpha13/gates/a13_g10_p1g_c1_native_prototype.py --help
          if ($LASTEXITCODE -ne 0) { throw 'P1G_C1_PYTHON_INVALID' }
      - name: Build candidate and reject four mutations
        shell: pwsh
        run: |
          python -B tools/alpha13/gates/a13_g10_p1g_c1_native_prototype.py --ci-standalone | Tee-Object -FilePath g10_p1g_c1.log
          if ($LASTEXITCODE -ne 0) { throw 'P1G_C1_NATIVE_FAILED' }
          $log=Get-Content g10_p1g_c1.log -Raw
          if ($log -notmatch 'G10_P1G_C1_STATUS=ISOLATED_BUS_LEASE_PROTOTYPE_NATIVE_PASS_ADOPTION_BLOCKED') { throw 'P1G_C1_STATUS_UNQUALIFIED' }
          if ($log -notmatch 'G10_P1G_C1_NEGATIVES=4') { throw 'P1G_C1_NEGATIVES_MISSING' }
      - name: Product unchanged
        shell: pwsh
        run: |
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'P1G_C1_PRODUCT_MUTATED' }
      - name: Native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha13-g10-p1g-c1-${{ matrix.os }}-${{ github.run_id }}
          path: |
            g10_p1g_c1.log
            tools/alpha13/results/g10_p1g_c1_*/
          if-no-files-found: warn
