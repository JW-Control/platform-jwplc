name: Alpha11 fix HTTP ESC final

on:
  push:
    branches:
      - v2.1.0-alpha.11/feature/hmi-designer
    paths:
      - ".github/workflows/alpha11-fix-http-esc-final.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar ESC con API moderna
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/fix.py
          python3 /tmp/fix.py
          git diff --check

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "JW-Control Actions"
          git config user.email "jw.control.peru@gmail.com"
          git add JWPLC/2.1.0/libraries/JWPLC_Ethernet/examples/Ethernet_HTTP_TFT_Diagnostics/Ethernet_HTTP_TFT_Diagnostics.ino
          git commit -m "fix(alpha11): usar goIdle moderno en diagnóstico HTTP"
          git push origin HEAD:v2.1.0-alpha.11/feature/hmi-designer
