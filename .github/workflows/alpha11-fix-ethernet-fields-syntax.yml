name: Alpha11 fix Ethernet TFT fields syntax

on:
  push:
    branches:
      - v2.1.0-alpha.11/feature/hmi-designer
    paths:
      - ".github/workflows/alpha11-fix-ethernet-fields-syntax.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Corregir marcadores duplicados
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          http = root / 'JWPLC/2.1.0/libraries/JWPLC_Ethernet/examples/Ethernet_HTTP_TFT_Diagnostics/Ethernet_HTTP_TFT_Diagnostics.ino'
          stress = root / 'JWPLC/2.1.0/libraries/JWPLC_Ethernet/examples/Ethernet_Continuous_Stress_TFT/Ethernet_Continuous_Stress_TFT.ino'
          spi = root / 'JWPLC/2.1.0/libraries/JWPLC_Ethernet/examples/Ethernet_SPI_Coexistence/Ethernet_SPI_Coexistence.ino'

          def fix(path, replacements):
              text = path.read_text(encoding='utf-8')
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'{path}: patrón esperado no encontrado: {old[:60]}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8', newline='\n')

          copy_sig = 'void copyText(char *dst, size_t size, const char *src)'
          fix(http, [(copy_sig + copy_sig, copy_sig)])
          fix(stress, [
              (copy_sig + copy_sig, copy_sig),
              ('void splitText3(const char *source,void splitText3(const char *source,',
               'void splitText3(const char *source,'),
          ])

          text = spi.read_text(encoding='utf-8')
          text = text.replace(
              '  snprintf(framLine, sizeof(framLine), "%s  Boot:%lu",\n framStatusText, (unsigned long)bootCounter);',
              '  snprintf(framLine, sizeof(framLine), "%s  Boot:%lu",\n           framStatusText, (unsigned long)bootCounter);')
          spi.write_text(text, encoding='utf-8', newline='\n')

          for path in (http, stress, spi):
              text = path.read_text(encoding='utf-8')
              if re.search(r'\)void\s+[A-Za-z_]', text):
                  raise SystemExit(f'{path}: firma duplicada detectada')
              if 'fillScreen(' in text or 'fillRect(' in text:
                  raise SystemExit(f'{path}: dibujo TFT manual todavía presente')
              if 'jwplcUIEnter' in text or 'jwplcUIUpdate' in text or 'jwplcUIExit' in text:
                  raise SystemExit(f'{path}: callback gráfico manual todavía presente')
              if 'USER_REFRESH_ON_DEMAND' not in text or '.setFields(' not in text:
                  raise SystemExit(f'{path}: fields/on-demand incompleto')

          for path in (http, stress):
              text = path.read_text(encoding='utf-8')
              if '#include <Ethernet.h>' in text:
                  raise SystemExit(f'{path}: include Ethernet genérico todavía presente')

          print('ALPHA11_ETHERNET_TFT_FIELDS_SYNTAX=PASS')
          PY

          git diff --check
          git diff --stat

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "JW-Control Actions"
          git config user.email "jw.control.peru@gmail.com"
          git add JWPLC/2.1.0/libraries/JWPLC_Ethernet/examples
          git commit -m "fix(alpha11): corregir sintaxis de fields TFT Ethernet"
          git push origin HEAD:v2.1.0-alpha.11/feature/hmi-designer
