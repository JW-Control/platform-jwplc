name: Alpha13 G10 P1F - W5500 socket epoch baseline

on:
  push:
    branches:
      - 'v2.1.0-alpha.13/feature/cleanup-robustness'
    paths:
      - '.github/workflows/alpha13-g10-p1f-socket-epoch-readonly.yml'
      - 'tools/alpha13/gates/a13_g10_p1f_socket_epoch_baseline.py'
      - 'tools/alpha13/gates/run_a13_g10_p1f_socket_epoch_baseline.bat'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p1f-readonly:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Sintaxis y ayuda
        shell: pwsh
        run: |
          python -m py_compile tools/alpha13/gates/a13_g10_p1f_socket_epoch_baseline.py
          python -B tools/alpha13/gates/a13_g10_p1f_socket_epoch_baseline.py --help
          if ($LASTEXITCODE -ne 0) { throw 'P1F_HELP_FAILED' }
      - name: Autoauditoria negativa reset y listener
        shell: pwsh
        run: |
          python -B tools/alpha13/gates/a13_g10_p1f_socket_epoch_baseline.py --selftest | Tee-Object -FilePath g10_p1f_selftest.log
          if ($LASTEXITCODE -ne 0) { throw 'P1F_SELFTEST_FAILED' }
          if ((Get-Content g10_p1f_selftest.log -Raw) -notmatch 'G10_P1F_SELFTEST=PASS_TWELVE_PATTERNS_TWO_NEGATIVES') { throw 'P1F_NEGATIVE_COVERAGE_MISSING' }
      - name: Baseline fuentes y hashes congelados
        shell: pwsh
        run: |
          python -B tools/alpha13/gates/a13_g10_p1f_socket_epoch_baseline.py --ci-standalone | Tee-Object -FilePath g10_p1f_snapshot.log
          if ($LASTEXITCODE -ne 0) { throw 'P1F_SNAPSHOT_FAILED' }
          if ((Get-Content g10_p1f_snapshot.log -Raw) -notmatch 'G10_P1F_STATUS=SOCKET_EPOCH_BASELINE_CAPTURED_ADOPTION_BLOCKED') { throw 'P1F_WRONG_STATUS' }
      - name: Git no modificado
        shell: pwsh
        run: |
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'P1F_PRODUCT_MUTATED' }
      - name: Evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha13-g10-p1f-${{ matrix.os }}-${{ github.run_id }}
          path: |
            g10_p1f_selftest.log
            g10_p1f_snapshot.log
            tools/alpha13/results/g10_p1f_*/
          if-no-files-found: warn
