name: Alpha13 G10 P1G-C2-S2B2B - outbound TCP source lifecycle
on:
  push:
    branches:
      - 'v2.1.0-alpha.13/feature/cleanup-robustness'
    paths:
      - '.github/workflows/alpha13-g10-p1g-c2-s2b2b-outbound-connect.yml'
      - 'tools/alpha13/gates/a13_g10_p1g_c2_s2b2b_outbound_connect.py'
      - 'tools/alpha13/gates/run_a13_g10_p1g_c2_s2b2b_outbound_connect.bat'
      - 'tools/alpha13/candidates/g10_p1g_c/native_c2_s2b2b_outbound_connect_test.cpp'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  outbound-source-cpp:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Script syntax
        shell: pwsh
        run: |
          python -m py_compile tools/alpha13/gates/a13_g10_p1g_c2_s2b2b_outbound_connect.py
          python -B tools/alpha13/gates/a13_g10_p1g_c2_s2b2b_outbound_connect.py --help
          if ($LASTEXITCODE -ne 0) { throw 'C2_S2B2B_SCRIPT_FAILED' }
      - name: Native 4 actual outbound methods plus 5 negative mutations
        shell: pwsh
        run: |
          python -B tools/alpha13/gates/a13_g10_p1g_c2_s2b2b_outbound_connect.py --ci-standalone | Tee-Object -FilePath c2_s2b2b.log
          if ($LASTEXITCODE -ne 0) { throw 'C2_S2B2B_NATIVE_FAILED' }
          $s = Get-Content c2_s2b2b.log -Raw
          if ($s -notmatch 'G10_P1G_C2_S2B2B_POSITIVE_NATIVE=PASS_REAL_OUTBOUND_LIFECYCLE') { throw 'S2B2B_POSITIVE_MISSING' }
          if ($s -notmatch 'G10_P1G_C2_S2B2B_NEGATIVES=5') { throw 'S2B2B_NEGATIVES_MISSING' }
          if ($s -notmatch 'G10_P1G_C2_S2B2B_STATUS=OUTBOUND_CONNECT_REAL_CPP_NATIVE_PASS_INCOMPLETE_ADOPTION_BLOCKED') { throw 'S2B2B_NOT_QUALIFIED' }
      - name: Product untouched
        shell: pwsh
        run: |
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'S2B2B_TRACKED_DIRTY' }
      - name: Native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha13-c2-s2b2b-${{ matrix.os }}-${{ github.run_id }}
          path: |
            c2_s2b2b.log
            tools/alpha13/results/g10_p1g_c2_s2b2b_*/
          if-no-files-found: warn
