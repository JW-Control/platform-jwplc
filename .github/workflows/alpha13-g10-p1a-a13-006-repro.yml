name: Alpha13 G10 P1A - reproduce TCP socket orphan

on:
  push:
    branches:
      - 'v2.1.0-alpha.13/feature/cleanup-robustness'
    paths:
      - '.github/workflows/alpha13-g10-p1a-a13-006-repro.yml'
      - 'tools/alpha13/gates/a13_g10_p1a_a13_006_repro.py'
      - 'tools/alpha13/gates/run_a13_g10_p1a_a13_006_repro.bat'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  g10-p1a-native:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Checkout with Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up MSVC host compiler on Windows
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Check source syntax and help
        shell: pwsh
        run: |
          python -m py_compile tools/alpha13/gates/a13_g10_p1a_a13_006_repro.py
          python -B tools/alpha13/gates/a13_g10_p1a_a13_006_repro.py --help
          if ($LASTEXITCODE -ne 0) { throw 'G10_P1A_HELP_FAILED' }
      - name: Compile current closeSession and dropClient bodies with host C++ mocks
        shell: pwsh
        run: |
          python -B tools/alpha13/gates/a13_g10_p1a_a13_006_repro.py --native --ci-standalone | Tee-Object -FilePath g10_p1a_native.log
          if ($LASTEXITCODE -ne 0) { throw 'G10_P1A_NATIVE_REPRO_FAILED' }
          if ((Get-Content g10_p1a_native.log -Raw) -notmatch 'G10_P1A_STATUS=NATIVE_BASELINE_DEFECT_REPRODUCED_NOT_FIXED') { throw 'G10_P1A_EXPECTED_REPRO_MARKER_MISSING' }
      - name: Assert checkout was not modified
        shell: pwsh
        run: |
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'G10_P1A_PRODUCT_MUTATED' }
      - name: Archive native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha13-g10-p1a-native-${{ matrix.os }}-${{ github.run_id }}
          path: |
            tools/alpha13/results/g10_p1a_*/
            g10_p1a_native.log
          if-no-files-found: warn
