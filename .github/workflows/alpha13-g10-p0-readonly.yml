name: Alpha13 G10 - P0 canonical audit baseline

on:
  push:
    branches:
      - 'v2.1.0-alpha.13/feature/cleanup-robustness'
    paths:
      - '.github/workflows/alpha13-g10-p0-readonly.yml'
      - 'tools/alpha13/gates/a13_g10_p0_readonly.py'
      - 'tools/alpha13/gates/run_a13_g10_p0_readonly.bat'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  g10-p0-audit:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - name: Checkout con historial Git
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Sintaxis y selftest sin editar producto
        shell: pwsh
        run: |
          python -m py_compile tools/alpha13/gates/a13_g10_p0_readonly.py
          python -B tools/alpha13/gates/a13_g10_p0_readonly.py --selftest
          if ($LASTEXITCODE -ne 0) { throw 'G10_P0_SELFTEST_FAILED' }
      - name: Capturar P0 readonly con flags de hallazgos abiertos
        shell: pwsh
        run: |
          python -B tools/alpha13/gates/a13_g10_p0_readonly.py | Tee-Object -FilePath g10_p0_ci.log
          if ($LASTEXITCODE -ne 0) { throw 'G10_P0_READONLY_FAILED' }
          if ((Get-Content g10_p0_ci.log -Raw) -notmatch 'G10_P0_STATUS=BASELINE_CAPTURED_REVIEW_FINDINGS_OPEN') { throw 'G10_P0_STATUS_MARKER_MISSING' }
      - name: Verificar Git intacto
        shell: pwsh
        run: |
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'G10_P0_MUTATED_PRODUCT' }
      - name: Archivar manifiesto del baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha13-g10-p0-${{ matrix.os }}-${{ github.run_id }}
          path: |
            tools/alpha13/results/g10_p0_*/
            g10_p0_ci.log
          if-no-files-found: warn
