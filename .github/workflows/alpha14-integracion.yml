# Workflow temporal de la integración 2.1.0-alpha.14 (HMI Designer sobre Alpha13).
# Se retira en el PR de cierre de la alpha (PRESUPUESTO_TOKENS_Y_CI §3.6).
#
# - designer-tests: en cada push del PR de integración hacia release/v2.1.x.
# - regen-tft / regen-display: sólo con la etiqueta del mismo nombre en el PR
#   (fase de congelado). El .a queda como artifact; se revisa y se sube a mano.
name: Alpha14 integración

on:
  pull_request:
    branches:
      - release/v2.1.x
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name || 'tests' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  designer-tests:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++ python3 binutils
          npm install -g playwright@1.48.2
          npx playwright@1.48.2 install --with-deps chromium

      - name: Tests del HMI Designer
        run: |
          export NODE_PATH="$(npm root -g)"
          node tools/jwplc-hmi-designer/tests/run-all.cjs

  regen:
    if: github.event.action == 'labeled' && (github.event.label.name == 'regen-tft' || github.event.label.name == 'regen-display')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Regenerar el .a
        run: |
          tools/alpha15/regenerate_libJWPLC_TFT.sh setup
          if [ "${{ github.event.label.name }}" = "regen-tft" ]; then
            tools/alpha15/regenerate_libJWPLC_TFT.sh build --install | tee regen.log
          else
            tools/alpha15/regenerate_libJWPLC_Display.sh build --install | tee regen.log
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.label.name }}
          path: |
            regen.log
            JWPLC/2.1.0/libraries/JWPLC_TFT/src/esp32/libJWPLC_TFT.a
            JWPLC/2.1.0/libraries/JWPLC_Display/src/esp32/libJWPLC_Display.a
          retention-days: 14
