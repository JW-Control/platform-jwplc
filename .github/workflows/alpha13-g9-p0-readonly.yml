name: Alpha13 G9 - P0 canonical cleanup baseline

on:
  push:
    branches:
      - 'v2.1.0-alpha.13/feature/cleanup-robustness'
    paths:
      - '.github/workflows/alpha13-g9-p0-readonly.yml'
      - 'tools/alpha13/gates/a13_g9_p0_readonly.py'
      - 'tools/alpha13/gates/run_a13_g9_p0_readonly.bat'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  g9-p0-readonly:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Descargar repo
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Autopruebas sin modificar producto
        shell: pwsh
        run: |
          python -m py_compile tools/alpha13/gates/a13_g9_p0_readonly.py
          python -B tools/alpha13/gates/a13_g9_p0_readonly.py --selftest
          if ($LASTEXITCODE -ne 0) { throw 'G9_P0_SELFTEST_FAILED' }
      - name: Capturar baseline Git, bytes y documentación
        shell: pwsh
        run: |
          python -B tools/alpha13/gates/a13_g9_p0_readonly.py | Tee-Object -FilePath g9_p0_ci.log
          if ($LASTEXITCODE -ne 0) { throw 'G9_P0_CAPTURE_FAILED' }
          if ((Get-Content g9_p0_ci.log -Raw) -notmatch 'G9_P0_STATUS=BASELINE_CAPTURED_READ_ONLY') { throw 'G9_P0_CAPTURE_MARKER_MISSING' }
      - name: Archivar evidencia P0
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha13-g9-p0-${{ matrix.os }}-${{ github.run_id }}
          path: |
            tools/alpha13/results/g9_p0_*/
            g9_p0_ci.log
          if-no-files-found: warn
