name: CI JWPLC Package Smoke

on:
  pull_request:
    # release/v2.1.x (cierre de una alpha) y la «…/main» de cada línea
    # (features de la alpha en curso, p. ej. v2.1.0-alpha.17/JWPLC-Sim/main).
    branches:
      - release/v2.1.x
      - "v2.1.0-alpha.*/*/main"
    paths:
      - "JWPLC/**"
      - "tools/build-speed-benchmark/sketches/**"
      - "tools/ci/**"
      - ".github/workflows/ci-jwplc-package-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read   # buscar el marcador de SIM_REGRESSION de otro run

env:
  # Commit de jwplc-sim del gate SIM_REGRESSION. Debe ser el mismo que el de
  # «uses:» del job sim-regression (y el de release-jwplc-package.yml).
  JWSIM_REF: "fd08f12cb6978ba283ea733d24cf47389934c675"
  ARDUINO_CLI_VERSION: "1.x"
  # Última alpha publicada usada únicamente como bootstrap del toolchain.
  # El árbol completo JWPLC/2.1.0 del PR se superpone después con rsync --delete.
  JWPLC_BOOTSTRAP_VERSION: "2.1.0-alpha.10"
  JWPLC_FQBN: "jwplc:esp32:jwplcbasic"
  JWPLC_INDEX_URL: "https://raw.githubusercontent.com/JW-Control/platform-jwplc/main/JWPLC/package_jwplc_index_dev.json"

jobs:
  compile-smoke:
    name: Compilar ejemplos críticos y gate integral
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: ${{ env.ARDUINO_CLI_VERSION }}

      - name: Restaurar package y toolchain JWPLC
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15/packages/jwplc
            ~/.arduino15/staging
          key: jwplc-${{ runner.os }}-${{ env.JWPLC_BOOTSTRAP_VERSION }}-${{ hashFiles('JWPLC/package_jwplc_index_dev.json') }}
          restore-keys: |
            jwplc-${{ runner.os }}-${{ env.JWPLC_BOOTSTRAP_VERSION }}-
            jwplc-${{ runner.os }}-

      - name: Configurar Arduino CLI
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls "$JWPLC_INDEX_URL"
          arduino-cli core update-index

      - name: Instalar package base y herramientas
        shell: bash
        run: |
          set -euo pipefail
          echo "JWPLC_BOOTSTRAP_VERSION=$JWPLC_BOOTSTRAP_VERSION"
          arduino-cli core install "jwplc:esp32@$JWPLC_BOOTSTRAP_VERSION"
          arduino-cli core list

      - name: Superponer y verificar plataforma del branch
        shell: bash
        run: |
          set -euo pipefail
          PLATFORM_DIR="$HOME/.arduino15/packages/jwplc/hardware/esp32/$JWPLC_BOOTSTRAP_VERSION"
          SOURCE_DIR="$GITHUB_WORKSPACE/JWPLC/2.1.0"

          test -d "$PLATFORM_DIR"
          test -d "$SOURCE_DIR"

          rsync -a --delete "$SOURCE_DIR/" "$PLATFORM_DIR/"

          test -f "$PLATFORM_DIR/boards.txt"
          test -f "$PLATFORM_DIR/platform.txt"
          test -f "$PLATFORM_DIR/precompiled/core/JWPLCBASIC/core.a"
          test -f "$PLATFORM_DIR/libraries/JWPLC_Display/src/esp32/libJWPLC_Display.a"

          # El nombre del directorio conserva la versión bootstrap, pero el
          # contenido activo debe ser exactamente el árbol del PR.
          cmp "$SOURCE_DIR/boards.txt" "$PLATFORM_DIR/boards.txt"
          cmp "$SOURCE_DIR/platform.txt" "$PLATFORM_DIR/platform.txt"
          cmp "$SOURCE_DIR/precompiled/core/JWPLCBASIC/core.a" \
              "$PLATFORM_DIR/precompiled/core/JWPLCBASIC/core.a"
          cmp "$SOURCE_DIR/libraries/JWPLC_Display/src/esp32/libJWPLC_Display.a" \
              "$PLATFORM_DIR/libraries/JWPLC_Display/src/esp32/libJWPLC_Display.a"

          echo "BOOTSTRAP_VERSION=$JWPLC_BOOTSTRAP_VERSION"
          echo "BRANCH_SHA=$GITHUB_SHA"
          echo "ACTIVE_PLATFORM_DIR=$PLATFORM_DIR"
          echo "BRANCH_OVERLAY_BYTE_PARITY=PASS"
          sha256sum "$PLATFORM_DIR/precompiled/core/JWPLCBASIC/core.a"
          sha256sum "$PLATFORM_DIR/libraries/JWPLC_Display/src/esp32/libJWPLC_Display.a"

          arduino-cli board listall "$JWPLC_FQBN"

      - name: Compilar smoke tests del package
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/jwplc-builds" "$GITHUB_WORKSPACE/ci-artifacts"

          sketches=(
            "JWPLC/2.1.0/libraries/JWPLC_GlobalPeripherals/examples/01.DigitalIO_Basic"
            "JWPLC/2.1.0/libraries/JWPLC_GlobalPeripherals/examples/02.Buttons_Basic"
            "JWPLC/2.1.0/libraries/JWPLC_Display/examples/01.Display_IDLE_Status"
            "JWPLC/2.1.0/libraries/JWPLC_Display/examples/02.Display_HMI_Fields"
            "JWPLC/2.1.0/libraries/JWPLC_Display/examples/04.Display_TFT_Direct"
            "JWPLC/2.1.0/libraries/JWPLC_Display/examples/12.Display_Efficient_Redraw"
            "JWPLC/2.1.0/libraries/JWPLC_Display/examples/13.Display_Idle_Return_Modes"
            "JWPLC/2.1.0/libraries/JWPLC_Display/examples/14.Display_UserUI_Callbacks"
            "JWPLC/2.1.0/libraries/JWPLC_Display/examples/16.Display_Tetris"
            "JWPLC/2.1.0/libraries/JWPLC_Display/examples/15.Display_FlappyBird"
            "JWPLC/2.1.0/libraries/JWPLC_Ethernet/examples/03.Ethernet_Diagnostics"
            "JWPLC/2.1.0/libraries/JWPLC_ModbusRTU/examples/01.ModbusRTU_Slave_Holding"
            "JWPLC/2.1.0/libraries/JWPLC_RS485/examples/04.RS485_Puente_USB"
            "tools/build-speed-benchmark/sketches/06_alpha4_local_physical_gate"
          )

          for sketch in "${sketches[@]}"; do
            name="$(basename "$sketch")"
            build_path="$RUNNER_TEMP/jwplc-builds/$name"
            log_file="$GITHUB_WORKSPACE/ci-artifacts/$name.log"

            echo "::group::Compilando $name"
            arduino-cli compile \
              --fqbn "$JWPLC_FQBN" \
              --warnings default \
              --build-path "$build_path" \
              "$sketch" 2>&1 | tee "$log_file"
            echo "::endgroup::"

            find "$build_path" -maxdepth 1 -type f \
              \( -name '*.bin' -o -name '*.elf' -o -name '*.map' \) \
              -exec cp {} "$GITHUB_WORKSPACE/ci-artifacts/" \;
          done

      - name: Publicar logs y binarios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jwplc-package-smoke-ci
          path: ci-artifacts/
          if-no-files-found: warn
          retention-days: 14

  # ¿Este árbol del package ya pasó SIM_REGRESSION con este jwplc-sim?
  # (p. ej. el PR «…/main» → release/v2.1.x tiene el mismo árbol que la
  # última feature fusionada). Si es así, no se repite el barrido.
  sim-cache:
    name: SIM_REGRESSION ya pasado para este árbol
    runs-on: ubuntu-latest
    outputs:
      reuse: ${{ steps.lookup.outputs.reuse }}
      name: ${{ steps.lookup.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/ci/sim_regression_marker.sh "$JWSIM_REF"

  # Mismo gate que en la release (SIM_REGRESSION de JWPLC Sim), sobre el
  # árbol del PR: avisa de una regresión simulada antes de llegar a publicar.
  sim-regression:
    name: SIM_REGRESSION (JWPLC Sim)
    needs: sim-cache
    if: ${{ needs.sim-cache.outputs.reuse != 'true' }}
    uses: JW-Control/jwplc-sim/.github/workflows/sim-regression.yml@fd08f12cb6978ba283ea733d24cf47389934c675
    with:
      sim_ref: fd08f12cb6978ba283ea733d24cf47389934c675

  # Deja el marcador para que la Release (y el CI siguiente) no repitan el
  # barrido sobre el mismo árbol. Ver tools/ci/sim_regression_marker.sh.
  sim-marker:
    name: Marcar árbol con SIM_REGRESSION=PASS
    needs: [sim-cache, sim-regression]
    if: ${{ needs.sim-regression.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p marker
          {
            echo "SIM_REGRESSION=PASS"
            echo "run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "sha=${GITHUB_SHA}"
            echo "jwsim_ref=${JWSIM_REF}"
          } > marker/SIM_REGRESSION.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.sim-cache.outputs.name }}
          path: marker/
          retention-days: 30
