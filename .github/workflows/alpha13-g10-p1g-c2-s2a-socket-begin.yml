name: Alpha13 G10 P1G-C2-S2A - source-backed socket begin ownership

on:
  push:
    branches:
      - 'v2.1.0-alpha.13/feature/cleanup-robustness'
    paths:
      - '.github/workflows/alpha13-g10-p1g-c2-s2a-socket-begin.yml'
      - 'tools/alpha13/gates/a13_g10_p1g_c2_s2a_socket_begin_lease.py'
      - 'tools/alpha13/gates/run_a13_g10_p1g_c2_s2a_socket_begin_lease.bat'
      - 'tools/alpha13/candidates/g10_p1g_c/JWPLC_W5500_SafeAccess.*'
      - 'tools/alpha13/candidates/g10_p1g_c/native_c2_s2a_socket_allocation_test.cpp'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  socket-begin-real-method:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python syntax and help
        shell: pwsh
        run: |
          python -m py_compile tools/alpha13/gates/a13_g10_p1g_c2_s2a_socket_begin_lease.py
          python -B tools/alpha13/gates/a13_g10_p1g_c2_s2a_socket_begin_lease.py --help
          if ($LASTEXITCODE -ne 0) { throw 'P1G_C2_S2A_SYNTAX' }
      - name: Real socketBegin native and four negative mutations
        shell: pwsh
        run: |
          python -B tools/alpha13/gates/a13_g10_p1g_c2_s2a_socket_begin_lease.py --ci-standalone | Tee-Object -FilePath c2_s2a.log
          if ($LASTEXITCODE -ne 0) { throw 'P1G_C2_S2A_NATIVE_FAILED' }
          $s=Get-Content c2_s2a.log -Raw
          if ($s -notmatch 'G10_P1G_C2_S2A_POSITIVE_NATIVE=PASS_REAL_SOCKET_BEGIN_LEASE') { throw 'S2A_POSITIVE_MISSING' }
          if ($s -notmatch 'G10_P1G_C2_S2A_NEGATIVES=4') { throw 'S2A_NEGATIVES_MISSING' }
          if ($s -notmatch 'G10_P1G_C2_S2A_STATUS=REAL_SOCKET_BEGIN_LEASE_NATIVE_PASS_INCOMPLETE_ADOPTION_BLOCKED') { throw 'S2A_WRONG_STATUS' }
      - name: Git tracked sources intact
        shell: pwsh
        run: |
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'PRODUCT_MUTATED_S2A' }
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha13-g10-p1g-c2-s2a-${{ matrix.os }}-${{ github.run_id }}
          path: |
            c2_s2a.log
            tools/alpha13/results/g10_p1g_c2_s2a_*/
          if-no-files-found: warn
