name: Alpha13 G10 P1E - W5500 generation baseline

on:
  push:
    branches:
      - 'v2.1.0-alpha.13/feature/cleanup-robustness'
    paths:
      - '.github/workflows/alpha13-g10-p1e-reset-generation-readonly.yml'
      - 'tools/alpha13/gates/a13_g10_p1e_ethernet_generation_readonly.py'
      - 'tools/alpha13/gates/run_a13_g10_p1e_ethernet_generation_readonly.bat'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readonly-generation:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python syntax and CLI help
        shell: pwsh
        run: |
          python -m py_compile tools/alpha13/gates/a13_g10_p1e_ethernet_generation_readonly.py
          python -B tools/alpha13/gates/a13_g10_p1e_ethernet_generation_readonly.py --help
          if ($LASTEXITCODE -ne 0) { throw 'G10_P1E_HELP_FAILED' }
      - name: Contract positive and negative
        shell: pwsh
        run: |
          python -B tools/alpha13/gates/a13_g10_p1e_ethernet_generation_readonly.py --selftest | Tee-Object -FilePath g10_p1e_selftest.log
          if ($LASTEXITCODE -ne 0) { throw 'G10_P1E_SOURCE_SELFTEST_FAILED' }
          if ((Get-Content g10_p1e_selftest.log -Raw) -notmatch 'G10_P1E_SELFTEST=PASS_READONLY_TEN_PATTERNS_AND_NEGATIVE') { throw 'G10_P1E_NEGATIVE_NOT_EXECUTED' }
      - name: Readonly source and archive snapshot
        shell: pwsh
        run: |
          python -B tools/alpha13/gates/a13_g10_p1e_ethernet_generation_readonly.py --ci-standalone | Tee-Object -FilePath g10_p1e_snapshot.log
          if ($LASTEXITCODE -ne 0) { throw 'G10_P1E_READONLY_SNAPSHOT_FAILED' }
          if ((Get-Content g10_p1e_snapshot.log -Raw) -notmatch 'G10_P1E_STATUS=RESET_GENERATION_BASELINE_CAPTURED_ADOPTION_BLOCKED') { throw 'G10_P1E_WRONG_CONCLUSION' }
      - name: Git product integrity
        shell: pwsh
        run: |
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'G10_P1E_MUTATED_CHECKOUT' }
      - name: Archive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha13-g10-p1e-${{ matrix.os }}-${{ github.run_id }}
          path: |
            g10_p1e_selftest.log
            g10_p1e_snapshot.log
            tools/alpha13/results/g10_p1e_*/
          if-no-files-found: warn
