name: Alpha13 G10 P0 - manifiesto funcional sin modificar package
on:
  pull_request:
    paths:
      - 'tools/alpha13/gates/a13_g10_p0_source_inventory.py'
      - '.github/workflows/alpha13-g10-p0-source-manifest.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    name: G10 P0 read-only ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Compose G10-I de forma reproducible, sin modificar JWPLC
        shell: bash
        run: |
          set -euo pipefail
          python tools/alpha13/gates/a13_g10_p0_source_inventory.py --output "${RUNNER_TEMP}/g10_p0_composition.json"
          test -s "${RUNNER_TEMP}/g10_p0_composition.json"
          python -c 'import json,sys; d=json.load(open(sys.argv[1], encoding="utf-8")); assert d["result"]=="PASS_G10_P0_READONLY_EXACT_COMPOSE"; assert len(d["files"])==14; assert d["new"]==2; assert d["f1_utility_w5100_not_in_overlay"]' "${RUNNER_TEMP}/g10_p0_composition.json"
          if test -n "$(git diff --name-only -- JWPLC/)"; then
            echo 'G10_P0_PRODUCT_CHANGED_REVIEW_STOP'
            exit 1
          fi
          echo 'G10_P0_PACKAGE_UNMODIFIED=PASS'
      - name: Guardar manifiesto de evidencias, no artifacts de firmware
        uses: actions/upload-artifact@v4
        with:
          name: g10-p0-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/g10_p0_composition.json
          if-no-files-found: error
          retention-days: 14
