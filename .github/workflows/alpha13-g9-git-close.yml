name: Alpha13 G9 - Git close dry-run selftest

on:
  push:
    branches:
      - 'v2.1.0-alpha.13/feature/cleanup-robustness'
    paths:
      - '.github/workflows/alpha13-g9-git-close.yml'
      - 'tools/alpha13/gates/a13_g9_git_close.py'
      - 'tools/alpha13/gates/a13_g9_git_close_selftest.py'
      - 'tools/alpha13/gates/run_a13_g9_git_close.bat'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  git-close-readonly:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python sintaxis y ayuda sin modificacion productiva
        shell: pwsh
        run: |
          python -m py_compile tools/alpha13/gates/a13_g9_git_close.py tools/alpha13/gates/a13_g9_git_close_selftest.py
          python -B tools/alpha13/gates/a13_g9_git_close.py --help
          if ($LASTEXITCODE -ne 0) { throw 'G9_GIT_HELP_FAILED' }
      - name: Probar Git INDEX y commit solo en repositorio temporal
        shell: pwsh
        run: |
          python -B tools/alpha13/gates/a13_g9_git_close_selftest.py | Tee-Object -FilePath g9_git_selftest.log
          if ($LASTEXITCODE -ne 0) { throw 'G9_GIT_SELFTEST_FAILED' }
          if ((Get-Content g9_git_selftest.log -Raw) -notmatch 'G9_GIT_SELFTEST=PASS_NO_PRODUCT_MUTATION') { throw 'G9_GIT_PASS_MARKER_MISSING' }
      - name: Checkout Git inalterado
        shell: pwsh
        run: |
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'G9_GIT_MUTATED_CHECKOUT' }
      - name: Guardar evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha13-g9-git-close-${{ matrix.os }}-${{ github.run_id }}
          path: g9_git_selftest.log
          if-no-files-found: warn
