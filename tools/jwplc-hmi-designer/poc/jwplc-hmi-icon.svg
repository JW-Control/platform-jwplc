<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17293a"/>
      <stop offset="1" stop-color="#0b1520"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#52585e"/>
      <stop offset="1" stop-color="#363b40"/>
    </linearGradient>
  </defs>

  <!-- Fondo de aplicación -->
  <rect x="5" y="5" width="246" height="246" rx="48" fill="url(#bg)" stroke="#2d4a63" stroke-width="4"/>

  <!-- Frente simplificado del JWPLC Basic -->
  <rect x="18" y="36" width="220" height="184" rx="18" fill="url(#panel)" stroke="#71777d" stroke-width="4"/>

  <!-- Tornillos: suficientemente grandes para seguir visibles a 16–24 px -->
  <circle cx="31" cy="50" r="7" fill="#050708" stroke="#666b70" stroke-width="2"/>
  <circle cx="225" cy="50" r="7" fill="#050708" stroke="#666b70" stroke-width="2"/>
  <circle cx="31" cy="206" r="7" fill="#050708" stroke="#666b70" stroke-width="2"/>
  <circle cx="225" cy="206" r="7" fill="#050708" stroke="#666b70" stroke-width="2"/>

  <!-- TFT: se priorizan bloques gruesos frente a detalles finos -->
  <rect x="38" y="69" width="110" height="112" rx="5" fill="#050d12" stroke="#161b1f" stroke-width="5"/>
  <rect x="47" y="79" width="92" height="34" rx="2" fill="#07313a" stroke="#00e7ef" stroke-width="4"/>
  <circle cx="62" cy="96" r="9" fill="none" stroke="#00e7ef" stroke-width="4"/>
  <path d="M57 96l4 4 8-9" fill="none" stroke="#f5ffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="79" y="87" width="49" height="6" rx="2" fill="#00e7ef"/>
  <rect x="79" y="99" width="36" height="6" rx="2" fill="#00e7ef"/>

  <!-- Gráfico inferior -->
  <rect x="47" y="121" width="92" height="50" rx="2" fill="#06202a" stroke="#00e7ef" stroke-width="4"/>
  <rect x="56" y="148" width="10" height="14" fill="#00e7ef"/>
  <rect x="72" y="141" width="10" height="21" fill="#00e7ef"/>
  <rect x="88" y="134" width="10" height="28" fill="#00e7ef"/>
  <rect x="104" y="126" width="10" height="36" fill="#00e7ef"/>
  <rect x="120" y="117" width="10" height="45" fill="#00e7ef"/>

  <!-- Botonera direccional -->
  <g fill="#252a2f" stroke="#111519" stroke-width="3">
    <rect x="177" y="72" width="28" height="28" rx="7"/>
    <rect x="154" y="96" width="28" height="28" rx="7"/>
    <rect x="200" y="96" width="28" height="28" rx="7"/>
    <rect x="177" y="120" width="28" height="28" rx="7"/>
  </g>
  <g fill="#f7fafc">
    <path d="M191 79l-9 13h18z"/>
    <path d="M161 110l13-9v18z"/>
    <path d="M221 110l-13-9v18z"/>
    <path d="M191 141l-9-13h18z"/>
  </g>

  <!-- ESC / OK -->
  <rect x="154" y="155" width="31" height="31" rx="8" fill="#f23c43" stroke="#671417" stroke-width="3"/>
  <path d="M162 163l15 15m0-15l-15 15" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
  <rect x="201" y="155" width="31" height="31" rx="8" fill="#55c85a" stroke="#14531a" stroke-width="3"/>
  <path d="M208 171l7 7 12-15" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Buzzer simplificado -->
  <g fill="#111417">
    <circle cx="193" cy="162" r="2.6"/><circle cx="193" cy="171" r="2.6"/><circle cx="193" cy="180" r="2.6"/>
    <circle cx="189" cy="166.5" r="2.6"/><circle cx="189" cy="175.5" r="2.6"/>
    <circle cx="197" cy="166.5" r="2.6"/><circle cx="197" cy="175.5" r="2.6"/>
